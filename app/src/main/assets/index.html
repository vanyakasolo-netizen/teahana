  <style>
:root {
  --bg: #0e0c10;
  --bg2: #171319;
  --card: #1d1822;
  --card2: #261f2d;
  --line: #3a3042;
  --text: #ece3d0;
  --muted: #a89fae;
  --gold: #d1a94f;
  --gold2: #f0d58a;
  --ember: #d2493a;
  --ok: #5fae7b;
  --arcane: #7d8cd6;
  --accent: var(--gold);
  --radius: 16px;
  --serif: "Cinzel", "Palatino Linotype", "Book Antiqua", Palatino, Georgia, serif;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", sans-serif;
  --safe-b: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; margin: 0; background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 16px; overscroll-behavior: none; touch-action: manipulation; }
body { background: radial-gradient(1200px 600px at 50% -10%, #231a2b 0%, var(--bg) 60%); }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
input, select, textarea { font: inherit; color: var(--text); }
[hidden] { display: none !important; }

#app { height: 100dvh; display: flex; flex-direction: column; max-width: 1100px; margin: 0 auto; }

/* ---------- верхняя панель ---------- */
.topbar { flex: none; display: flex; align-items: center; justify-content: space-between; padding: max(10px, env(safe-area-inset-top)) 14px 6px; }
.brand { display: flex; align-items: center; gap: 10px; }
.brand h1 { margin: 0; font-family: var(--serif); font-size: 1.15rem; letter-spacing: .08em; text-transform: uppercase; color: var(--gold2); font-weight: 600; }
.rune { display: grid; place-items: center; width: 34px; height: 34px; border: 1px solid var(--gold); border-radius: 50%; color: var(--gold); font-size: 1.1rem; box-shadow: 0 0 14px rgba(209, 169, 79, .25) inset; }
.top-actions { display: flex; gap: 6px; }
.icon-btn { width: 44px; height: 44px; border-radius: 12px; background: var(--card); border: 1px solid var(--line); font-size: 1.2rem; display: grid; place-items: center; }
.icon-btn:active { background: var(--card2); }

/* ---------- фильтры ---------- */
.chips { flex: none; display: flex; gap: 8px; padding: 6px 14px 10px; overflow-x: auto; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; padding: 8px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--bg2); color: var(--muted); font-size: .9rem; white-space: nowrap; min-height: 38px; }
.chip.on { color: #1a1408; background: var(--gold); border-color: var(--gold); font-weight: 600; }

/* ---------- сетка карточек ---------- */
.grid { flex: 1; overflow-y: auto; padding: 4px 14px 16px; display: grid; grid-template-columns: repeat(auto-fill, minmax(158px, 1fr)); gap: 12px; align-content: start; -webkit-overflow-scrolling: touch; }
.empty { grid-column: 1 / -1; text-align: center; color: var(--muted); padding: 40px 10px; }
.card { position: relative; background: linear-gradient(180deg, var(--card2), var(--card)); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 12px 10px; display: flex; flex-direction: column; gap: 4px; cursor: pointer; transition: transform .12s, box-shadow .2s, border-color .2s; user-select: none; -webkit-user-select: none; }
.card:active { transform: scale(.98); }
.card.selected { border-color: var(--cc, var(--gold)); box-shadow: 0 0 0 1px var(--cc, var(--gold)), 0 0 22px color-mix(in srgb, var(--cc, var(--gold)) 38%, transparent); background: linear-gradient(180deg, color-mix(in srgb, var(--cc, var(--gold)) 14%, var(--card2)), var(--card)); }
.card .badge { position: absolute; top: 10px; left: 10px; font-size: .68rem; letter-spacing: .06em; text-transform: uppercase; color: #1a1408; background: var(--cc, var(--gold)); padding: 2px 8px; border-radius: 999px; font-weight: 700; display: none; }
.card.selected .badge { display: block; }
.card .fav { position: absolute; top: 4px; right: 4px; width: 40px; height: 40px; font-size: 1.25rem; color: var(--muted); border-radius: 10px; }
.card .fav.on { color: var(--gold2); }
.avatar { width: 64px; height: 64px; border-radius: 50%; margin: 18px auto 4px; display: grid; place-items: center; font-size: 2.1rem; background: radial-gradient(circle at 35% 30%, color-mix(in srgb, var(--cc, var(--gold)) 35%, #2a2230), #19141e 75%); border: 2px solid color-mix(in srgb, var(--cc, var(--gold)) 70%, transparent); overflow: hidden; }
.avatar img { width: 100%; height: 100%; object-fit: cover; }
.card h3 { margin: 4px 0 0; font-family: var(--serif); font-size: 1rem; text-align: center; color: var(--gold2); line-height: 1.2; }
.card .meta { margin: 0; text-align: center; color: var(--text); font-size: .82rem; }
.card .kind { margin: 0; text-align: center; color: var(--muted); font-size: .76rem; }
.card .desc { margin: 2px 0 4px; color: var(--muted); font-size: .8rem; line-height: 1.3; text-align: center; min-height: 2.1em; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.card .actions { display: flex; gap: 6px; margin-top: auto; }
.card .actions button { flex: 1; min-height: 42px; border-radius: 10px; background: #130f17; border: 1px solid var(--line); font-size: .88rem; }
.card .actions .play { flex: 2; }
.card .actions .play.busy { background: var(--accent); color: #1a1408; }
.tag-engine { position: absolute; bottom: 62px; right: 10px; font-size: .62rem; color: var(--arcane); border: 1px solid var(--arcane); border-radius: 6px; padding: 0 5px; }

/* ---------- нижняя панель ---------- */
.dock { flex: none; background: linear-gradient(180deg, rgba(23, 19, 25, .96), #120e15); border-top: 1px solid var(--line); padding: 6px 12px calc(8px + var(--safe-b)); box-shadow: 0 -10px 30px rgba(0, 0, 0, .45); }
.quick { display: flex; gap: 6px; overflow-x: auto; padding: 2px 0 6px; scrollbar-width: none; }
.quick::-webkit-scrollbar { display: none; }
.q-item { flex: none; width: 54px; text-align: center; }
.q-item .qa { width: 46px; height: 46px; margin: 0 auto; border-radius: 50%; display: grid; place-items: center; font-size: 1.5rem; background: #1b1620; border: 2px solid var(--line); overflow: hidden; }
.q-item .qa img { width: 100%; height: 100%; object-fit: cover; }
.q-item.on .qa { border-color: var(--cc, var(--gold)); box-shadow: 0 0 14px color-mix(in srgb, var(--cc, var(--gold)) 55%, transparent); }
.q-item span { display: block; font-size: .64rem; color: var(--muted); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.q-item.on span { color: var(--text); }

.mic-row { display: flex; align-items: center; justify-content: center; gap: 14px; }
.nav-btn { width: 48px; height: 48px; border-radius: 50%; background: var(--card); border: 1px solid var(--line); font-size: 1.8rem; line-height: 1; color: var(--gold2); }
.nav-btn:active { background: var(--card2); }
.mic { position: relative; width: 100%; max-width: 280px; height: 62px; border-radius: 36px; display: flex; align-items: center; justify-content: center; gap: 12px; background: linear-gradient(180deg, #2b2233, #1b1520); border: 2px solid var(--gold); color: var(--gold2); font-size: 1.05rem; font-weight: 600; box-shadow: 0 0 22px rgba(209, 169, 79, .2); }
.mic .mic-icon { font-size: 1.7rem; }
.mic .mic-ring { position: absolute; inset: -6px; border-radius: 42px; border: 2px solid transparent; pointer-events: none; }
.mic.on { background: linear-gradient(180deg, #6b2018, #3d1410); border-color: var(--ember); color: #ffe3dc; box-shadow: 0 0 26px rgba(210, 73, 58, .45); }
.mic.on .mic-ring { border-color: rgba(210, 73, 58, .5); animation: pulse 1.6s ease-out infinite; }
.mic.speech { box-shadow: 0 0 34px rgba(240, 120, 90, .75); }
.mic.warn { border-color: #e6a23c; }
@keyframes pulse { 0% { transform: scale(.98); opacity: .9; } 100% { transform: scale(1.08); opacity: 0; } }

.status-row { margin-top: 6px; display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; align-items: center; }
.now { font-family: var(--serif); color: var(--gold2); font-size: .95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.status { grid-column: 1; color: var(--muted); font-size: .82rem; min-height: 1.2em; }
.meters { grid-column: 2; grid-row: 1 / span 2; display: flex; flex-direction: column; gap: 3px; width: 128px; }
.meter { display: flex; align-items: center; gap: 6px; font-size: .62rem; color: var(--muted); }
.meter span { width: 32px; text-align: right; }
.meter i { flex: 1; height: 7px; background: #0b090d; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; display: block; }
.meter b { display: block; height: 100%; width: 0%; background: linear-gradient(90deg, #4f9a6c, #d1a94f 70%, #d2493a); transition: width .06s linear; }
.fb-row { grid-column: 1 / -1; display: flex; gap: 10px; align-items: center; background: #3a2412; border: 1px solid #e6a23c; border-radius: 12px; padding: 8px 10px; font-size: .82rem; margin-top: 6px; }

.controls { display: flex; gap: 6px; align-items: center; margin-top: 6px; flex-wrap: wrap; }
.seg { display: flex; background: #130f17; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.seg button { padding: 0 11px; min-height: 40px; color: var(--muted); font-size: .86rem; }
.seg button.on { background: var(--gold); color: #1a1408; font-weight: 700; }
.toggle { display: flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 10px; border: 1px solid var(--line); border-radius: 12px; background: #130f17; color: var(--muted); font-size: .82rem; }
.toggle .dot { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--muted); }
.toggle[aria-pressed="true"] { color: var(--text); border-color: var(--ok); }
.toggle[aria-pressed="true"] .dot { background: var(--ok); border-color: var(--ok); }

.btn { min-height: 46px; padding: 0 16px; border-radius: 12px; background: var(--card2); border: 1px solid var(--line); color: var(--text); }
.btn:active { filter: brightness(1.2); }
.btn.small { min-height: 40px; padding: 0 12px; font-size: .88rem; }
.btn.primary { background: var(--gold); color: #1a1408; border-color: var(--gold); font-weight: 700; }
.btn.danger { color: #ff9a8c; border-color: #6b2c26; }
.btn.block { width: 100%; }

/* ---------- окна ---------- */
.overlay { position: fixed; inset: 0; background: rgba(5, 3, 8, .72); display: flex; align-items: flex-end; justify-content: center; z-index: 30; animation: fade .15s; }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
.sheet { width: 100%; max-width: 620px; max-height: 92dvh; overflow-y: auto; background: var(--bg2); border: 1px solid var(--line); border-radius: 22px 22px 0 0; padding: 16px 16px calc(18px + var(--safe-b)); animation: up .2s ease-out; }
@keyframes up { from { transform: translateY(40px); } to { transform: none; } }
.sheet h2 { margin: 0 0 12px; font-family: var(--serif); color: var(--gold2); font-size: 1.15rem; letter-spacing: .05em; }
.sheet h4 { margin: 18px 0 8px; color: var(--gold); font-family: var(--serif); font-size: .92rem; letter-spacing: .06em; text-transform: uppercase; }
.sheet .row { display: flex; gap: 10px; align-items: center; margin: 8px 0; }
.sheet .row.wrap { flex-wrap: wrap; }
.sheet .row > * { min-width: 0; }
.sheet label.f { display: block; margin: 10px 0 4px; font-size: .8rem; color: var(--muted); }
.sheet input[type=text], .sheet select, .sheet textarea { width: 100%; min-height: 46px; padding: 8px 12px; background: #0f0c12; border: 1px solid var(--line); border-radius: 12px; }
.sheet textarea { min-height: 70px; resize: vertical; }
.sheet .hint { color: var(--muted); font-size: .8rem; line-height: 1.35; margin: 4px 0; }
.sheet .hint.warn { color: #f0b46a; }
.sheet .sticky { position: sticky; bottom: calc(-18px - var(--safe-b)); background: linear-gradient(180deg, transparent, var(--bg2) 30%); padding-top: 14px; display: flex; gap: 8px; }
.sheet .sticky .btn { flex: 1; }
.grid-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

.slider { margin: 12px 0; }
.slider .top { display: flex; justify-content: space-between; align-items: baseline; font-size: .9rem; }
.slider .top b { color: var(--gold2); font-variant-numeric: tabular-nums; }
.slider small { color: var(--muted); font-size: .72rem; }
.slider.dim { opacity: .5; }
input[type=range] { width: 100%; height: 40px; background: transparent; -webkit-appearance: none; appearance: none; }
input[type=range]::-webkit-slider-runnable-track { height: 6px; border-radius: 3px; background: linear-gradient(90deg, var(--gold) var(--p, 50%), #342b3b var(--p, 50%)); }
input[type=range]::-moz-range-track { height: 6px; border-radius: 3px; background: #342b3b; }
input[type=range]::-moz-range-progress { height: 6px; border-radius: 3px; background: var(--gold); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 28px; height: 28px; margin-top: -11px; border-radius: 50%; background: var(--gold2); border: 3px solid #1a1408; box-shadow: 0 0 0 1px var(--gold); }
input[type=range]::-moz-range-thumb { width: 24px; height: 24px; border-radius: 50%; background: var(--gold2); border: 3px solid #1a1408; }

.emoji-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(46px, 1fr)); gap: 6px; margin: 8px 0; }
.emoji-grid button { height: 46px; font-size: 1.5rem; border-radius: 10px; background: #0f0c12; border: 1px solid var(--line); }
.emoji-grid button.on { border-color: var(--gold); background: #2a2230; }
.edit-avatar { display: flex; align-items: center; gap: 12px; }
.edit-avatar .avatar { margin: 0; width: 72px; height: 72px; flex: none; }

.cat-list { display: flex; flex-direction: column; gap: 6px; }
.lib-row { display: flex; align-items: center; gap: 10px; padding: 8px; border: 1px solid var(--line); border-radius: 12px; background: #120e15; }
.lib-row .avatar { margin: 0; width: 40px; height: 40px; font-size: 1.3rem; flex: none; border-width: 1px; }
.lib-row .nm { flex: 1; min-width: 0; font-size: .92rem; }
.lib-row .nm small { display: block; color: var(--muted); }
.lib-row button { width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--line); background: #1b1620; }

.status-line { padding: 8px 12px; border-radius: 10px; font-size: .86rem; background: #120e15; border: 1px solid var(--line); }
.status-line.ok { border-color: var(--ok); }
.status-line.bad { border-color: #8a4a2c; color: #f0b46a; }

/* ---------- запись пробной фразы ---------- */
.rec-overlay { position: fixed; inset: 0; z-index: 40; display: grid; place-items: center; background: rgba(5, 3, 8, .88); text-align: center; padding: 20px; }
.rec-circle { width: 140px; height: 140px; margin: 0 auto 18px; border-radius: 50%; border: 3px solid var(--ember); display: grid; place-items: center; font-family: var(--serif); font-size: 3.4rem; color: #ffe3dc; animation: pulse 1.2s ease-out infinite; }
.rec-box p { font-size: 1.15rem; margin: 6px 0; }
.rec-box small { color: var(--muted); }

#toasts { position: fixed; left: 0; right: 0; top: max(10px, env(safe-area-inset-top)); display: flex; flex-direction: column; align-items: center; gap: 8px; z-index: 60; pointer-events: none; padding: 0 12px; }
.toast { pointer-events: auto; max-width: 560px; padding: 12px 16px; border-radius: 14px; background: #2a2230; border: 1px solid var(--gold); color: var(--text); font-size: .92rem; line-height: 1.35; box-shadow: 0 8px 30px rgba(0, 0, 0, .5); animation: up .2s; }
.toast.err { border-color: var(--ember); background: #3a1814; }
.toast.ok { border-color: var(--ok); }

/* ---------- ландшафт на телефоне: панель справа ---------- */
@media (orientation: landscape) and (max-height: 520px) {
  #app { display: grid; grid-template-columns: 1fr 300px; grid-template-rows: auto auto 1fr; grid-template-areas: "top dock" "chips dock" "grid dock"; max-width: none; }
  .topbar { grid-area: top; padding-top: 6px; }
  .chips { grid-area: chips; padding-bottom: 6px; }
  .grid { grid-area: grid; }
  .dock { grid-area: dock; overflow-y: auto; border-top: 0; border-left: 1px solid var(--line); padding: 8px 10px; }
  .mic { height: 58px; }
  .meters { width: 100px; }
}
@media (min-width: 760px) {
  .mic { max-width: 320px; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

details.emoji-pick { margin: 6px 0 2px; }
details.emoji-pick summary { cursor: pointer; padding: 10px 2px; color: var(--gold); font-size: .9rem; list-style: none; }
details.emoji-pick summary::-webkit-details-marker { display: none; }
details.emoji-pick summary::before { content: '▸ '; }
details.emoji-pick[open] summary::before { content: '▾ '; }

.gender-btn { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; min-height: 110px; font-size: 1.05rem; }
.gender-btn .g-emoji { font-size: 2.6rem; line-height: 1; }

</style>
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand"><span class="rune" aria-hidden="true">ᚦ</span><h1>Голоса NPC</h1></div>
      <div class="top-actions">
        <button class="icon-btn" id="btnAdd" aria-label="Создать NPC" title="Создать NPC">＋</button>
        <button class="icon-btn" id="btnLibrary" aria-label="Библиотека" title="Библиотека">📚</button>
        <button class="icon-btn" id="btnSettings" aria-label="Настройки" title="Настройки">⚙</button>
      </div>
    </header>

    <nav class="chips" id="chips" aria-label="Категории"></nav>

    <main id="grid" class="grid" aria-live="polite"></main>

    <footer class="dock" id="dock">
      <div class="quick" id="quick" aria-label="Быстрый выбор NPC"></div>

      <div class="mic-row">
        <button class="nav-btn" id="btnPrev" aria-label="Предыдущий NPC">‹</button>
        <button class="mic" id="btnMic" aria-pressed="false">
          <span class="mic-ring"></span>
          <span class="mic-icon" aria-hidden="true">🎙</span>
          <span class="mic-label" id="micLabel">Включить микрофон</span>
        </button>
        <button class="nav-btn" id="btnNext" aria-label="Следующий NPC">›</button>
      </div>

      <div class="status-row">
        <div class="now" id="nowVoice">NPC не выбран</div>
        <div class="status" id="statusText">Микрофон выключен</div>
        <div class="meters" aria-hidden="true">
          <div class="meter"><span>вход</span><i><b id="meterIn"></b></i></div>
          <div class="meter"><span>выход</span><i><b id="meterOut"></b></i></div>
        </div>
        <div class="fb-row" id="fbRow" hidden>
          <span>Обратная связь — звук заглушён. Уберите динамик от микрофона или наденьте наушники.</span>
          <button class="btn small" id="btnUnmute">Включить звук</button>
        </div>
      </div>

      <div class="controls">
        <div class="seg" role="group" aria-label="Режим">
          <button data-mode="live" id="modeLive">Живой</button>
          <button data-mode="phrase" id="modePhrase">Фразы</button>
        </div>
        <button class="toggle" id="btnAutoplay" aria-pressed="true"><span class="dot"></span>Авто-звук</button>
        <button class="toggle" id="btnMonitor" aria-pressed="false" title="Слушать свой исходный голос"><span class="dot"></span>Оригинал</button>
        <button class="btn small" id="btnPhoneRec" hidden>🎙 Записать на телефон</button>
        <button class="btn small" id="btnReplay" hidden>▶ Повторить</button>
        <button class="btn small" id="btnReplayOrig" hidden>▶ Оригинал</button>
      </div>
    </footer>
  </div>

  <!-- Нижние окна -->
  <div class="overlay" id="overlay" hidden>
    <section class="sheet" id="sheet" role="dialog" aria-modal="true"></section>
  </div>

  <div class="rec-overlay" id="recOverlay" hidden>
    <div class="rec-box">
      <div class="rec-circle"><span id="recCount">4</span></div>
      <p id="recText">Скажите любую фразу обычным голосом</p>
      <small>Она нужна, чтобы примеры NPC звучали на основе вашего голоса</small>
    </div>
  </div>

  <div id="toasts" aria-live="assertive"></div>

  <input type="file" id="fileImport" accept="application/json,.json" hidden>
  <input type="file" id="fileRec" accept="audio/*" capture hidden>
  <input type="file" id="fileAvatar" accept="image/*" hidden>

  <script>
window.VDND_WORKLET_SRC = "/*\n * dsp-core.js \u2014 \u044f\u0434\u0440\u043e \u043f\u0440\u0435\u043e\u0431\u0440\u0430\u0437\u043e\u0432\u0430\u043d\u0438\u044f \u0442\u0435\u043c\u0431\u0440\u0430 \u0433\u043e\u043b\u043e\u0441\u0430.\n *\n * \u041a\u043b\u0430\u0441\u0441\u0438\u0447\u0435\u0441\u043a\u0438\u0439 \u0441\u043a\u0440\u0438\u043f\u0442 (\u043d\u0435 \u043c\u043e\u0434\u0443\u043b\u044c): \u043e\u0434\u0438\u043d \u0438 \u0442\u043e\u0442 \u0436\u0435 \u043a\u043e\u0434 \u0440\u0430\u0431\u043e\u0442\u0430\u0435\u0442\n *  - \u0432 AudioWorklet (\u0436\u0438\u0432\u043e\u0439 \u0440\u0435\u0436\u0438\u043c, \u043f\u043e\u0442\u043e\u043a\u043e\u0432\u0430\u044f \u043e\u0431\u0440\u0430\u0431\u043e\u0442\u043a\u0430),\n *  - \u043d\u0430 \u043e\u0431\u044b\u0447\u043d\u043e\u0439 \u0441\u0442\u0440\u0430\u043d\u0438\u0446\u0435 (\u0440\u0435\u0436\u0438\u043c \u0444\u0440\u0430\u0437, \u043e\u0444\u043b\u0430\u0439\u043d-\u043e\u0431\u0440\u0430\u0431\u043e\u0442\u043a\u0430),\n *  - \u0432 Node (\u0430\u0432\u0442\u043e\u0442\u0435\u0441\u0442\u044b).\n *\n * \u041c\u0435\u0442\u043e\u0434: \u0444\u0430\u0437\u043e\u0432\u044b\u0439 \u0432\u043e\u043a\u043e\u0434\u0435\u0440 \u0441 \u0420\u0410\u0417\u0414\u0415\u041b\u0415\u041d\u0418\u0415\u041c \u0438\u0441\u0442\u043e\u0447\u043d\u0438\u043a\u0430 \u0438 \u0444\u0438\u043b\u044c\u0442\u0440\u0430.\n *   1. \u0421\u043f\u0435\u043a\u0442\u0440 \u043a\u0430\u0434\u0440\u0430 \u0434\u0435\u043b\u0438\u0442\u0441\u044f \u043d\u0430 \u043e\u0433\u0438\u0431\u0430\u044e\u0449\u0443\u044e (\u0444\u043e\u0440\u043c\u0430\u043d\u0442\u044b = \u00ab\u0442\u0435\u043c\u0431\u0440 \u0433\u043e\u043b\u043e\u0441\u043e\u0432\u043e\u0433\u043e \u0442\u0440\u0430\u043a\u0442\u0430\u00bb,\n *      \u0441\u0447\u0438\u0442\u0430\u0435\u0442\u0441\u044f \u0447\u0435\u0440\u0435\u0437 \u043a\u0435\u043f\u0441\u0442\u0440) \u0438 \u0432\u043e\u0437\u0431\u0443\u0436\u0434\u0435\u043d\u0438\u0435 (\u0433\u0430\u0440\u043c\u043e\u043d\u0438\u043a\u0438 = \u00ab\u0432\u044b\u0441\u043e\u0442\u0430\u00bb).\n *   2. \u0412\u043e\u0437\u0431\u0443\u0436\u0434\u0435\u043d\u0438\u0435 \u0441\u0434\u0432\u0438\u0433\u0430\u0435\u0442\u0441\u044f \u043f\u043e \u0432\u044b\u0441\u043e\u0442\u0435 (pitch), \u043e\u0433\u0438\u0431\u0430\u044e\u0449\u0430\u044f \u2014 \u043d\u0435\u0437\u0430\u0432\u0438\u0441\u0438\u043c\u043e (\u0444\u043e\u0440\u043c\u0430\u043d\u0442\u044b).\n *      \u041f\u043e\u044d\u0442\u043e\u043c\u0443 \u0442\u0435\u043c\u0431\u0440 \u043c\u0435\u043d\u044f\u0435\u0442\u0441\u044f, \u0430 \u043d\u0435 \u0442\u043e\u043b\u044c\u043a\u043e \u0432\u044b\u0441\u043e\u0442\u0430.\n *   3. \u041f\u043e\u0432\u0435\u0440\u0445: \u0445\u0440\u0438\u043f\u043e\u0442\u0430/\u0448\u0451\u043f\u043e\u0442 (\u0441\u043b\u0443\u0447\u0430\u0439\u043d\u044b\u0435 \u0444\u0430\u0437\u044b), \u0433\u043b\u0443\u0431\u0438\u043d\u0430 \u0438 \u044f\u0440\u043a\u043e\u0441\u0442\u044c (\u0444\u043e\u0440\u043c\u0430 \u043e\u0433\u0438\u0431\u0430\u044e\u0449\u0435\u0439),\n *      \u0440\u044b\u0447\u0430\u043d\u0438\u0435, \u044d\u0445\u043e, \u0433\u0440\u043e\u043c\u043a\u043e\u0441\u0442\u044c, \u043c\u044f\u0433\u043a\u0438\u0439 \u043b\u0438\u043c\u0438\u0442\u0435\u0440.\n *\n * \u042d\u0442\u043e \u043a\u043b\u0430\u0441\u0441\u0438\u0447\u0435\u0441\u043a\u0430\u044f \u043e\u0431\u0440\u0430\u0431\u043e\u0442\u043a\u0430 \u0441\u0438\u0433\u043d\u0430\u043b\u0430, \u0430 \u043d\u0435 \u043d\u0435\u0439\u0440\u043e\u0441\u0435\u0442\u044c. \u041d\u0435\u0439\u0440\u043e\u0441\u0435\u0442\u0435\u0432\u043e\u0435 \u043f\u0440\u0435\u043e\u0431\u0440\u0430\u0437\u043e\u0432\u0430\u043d\u0438\u0435\n * (RVC) \u043f\u043e\u0434\u043a\u043b\u044e\u0447\u0430\u0435\u0442\u0441\u044f \u043e\u0442\u0434\u0435\u043b\u044c\u043d\u043e \u0447\u0435\u0440\u0435\u0437 \u0441\u0435\u0440\u0432\u0435\u0440 \u043d\u0430 \u043a\u043e\u043c\u043f\u044c\u044e\u0442\u0435\u0440\u0435 (\u0441\u043c. server/).\n */\n(function (g) {\n  'use strict';\n\n  const TWO_PI = Math.PI * 2;\n\n  /* ------------------------------------------------------------------ */\n  /* \u041f\u0430\u0440\u0430\u043c\u0435\u0442\u0440\u044b \u043f\u043e \u0443\u043c\u043e\u043b\u0447\u0430\u043d\u0438\u044e \u0438 \u0438\u0445 \u0433\u0440\u0430\u043d\u0438\u0446\u044b                                 */\n  /* ------------------------------------------------------------------ */\n  const DEFAULT_PARAMS = {\n    pitch: 0,     // \u043f\u043e\u043b\u0443\u0442\u043e\u043d\u0430, -12..+12  \u2014 \u0432\u044b\u0441\u043e\u0442\u0430 \u0433\u043e\u043b\u043e\u0441\u0430\n    formant: 0,   // \u043f\u043e\u043b\u0443\u0442\u043e\u043d\u0430, -8..+8    \u2014 \u0442\u0435\u043c\u0431\u0440 (\u0441\u0434\u0432\u0438\u0433 \u0444\u043e\u0440\u043c\u0430\u043d\u0442)\n    depth: 0,     // 0..1                \u2014 \u0433\u043b\u0443\u0431\u0438\u043d\u0430 (\u0431\u0430\u0441, \u0442\u0451\u043c\u043d\u044b\u0439 \u0437\u0432\u0443\u043a)\n    tilt: 0,      // -1..+1              \u2014 \u044f\u0440\u043a\u043e\u0441\u0442\u044c (\u043d\u0430\u043a\u043b\u043e\u043d \u0441\u043f\u0435\u043a\u0442\u0440\u0430)\n    breath: 0,    // 0..1                \u2014 \u0445\u0440\u0438\u043f\u043e\u0442\u0430 / \u0448\u0451\u043f\u043e\u0442\n    growl: 0,     // 0..1                \u2014 \u0440\u044b\u0447\u0430\u043d\u0438\u0435\n    echo: 0,      // 0..1                \u2014 \u044d\u0445\u043e\n    speed: 1,     // 0.6..1.6            \u2014 \u0441\u043a\u043e\u0440\u043e\u0441\u0442\u044c \u0440\u0435\u0447\u0438 (\u0442\u043e\u043b\u044c\u043a\u043e \u0440\u0435\u0436\u0438\u043c \u0444\u0440\u0430\u0437)\n    volume: 1,    // 0..2                \u2014 \u0433\u0440\u043e\u043c\u043a\u043e\u0441\u0442\u044c\n    lively: 0,    // 0..1.5              \u2014 \u0436\u0438\u0432\u043e\u0441\u0442\u044c: \u0448\u0438\u0440\u0435 \u0438\u043d\u0442\u043e\u043d\u0430\u0446\u0438\u044f + \u043b\u0451\u0433\u043a\u0438\u0439 \u0434\u0440\u0435\u0439\u0444 \u0432\u044b\u0441\u043e\u0442\u044b\n    layer: 0      // 0..1                \u2014 \u0440\u0430\u0437\u0434\u0432\u043e\u0435\u043d\u0438\u0435: \u0434\u043e\u0431\u0430\u0432\u043b\u044f\u0435\u0442 \u043a\u043e\u043f\u0438\u044e \u0433\u043e\u043b\u043e\u0441\u0430 \u043d\u0430 \u043e\u043a\u0442\u0430\u0432\u0443 \u043d\u0438\u0436\u0435\n  };\n\n  function mergeParams(p) {\n    const o = Object.assign({}, DEFAULT_PARAMS);\n    if (p) for (const k in DEFAULT_PARAMS) if (typeof p[k] === 'number' && isFinite(p[k])) o[k] = p[k];\n    return o;\n  }\n\n  /* ------------------------------------------------------------------ */\n  /* \u0411\u041f\u0424 (radix-2)                                                       */\n  /* ------------------------------------------------------------------ */\n  class FFT {\n    constructor(n) {\n      this.n = n;\n      const levels = Math.round(Math.log2(n));\n      if ((1 << levels) !== n) throw new Error('FFT size must be a power of two');\n      this.cos = new Float64Array(n / 2);\n      this.sin = new Float64Array(n / 2);\n      for (let i = 0; i < n / 2; i++) {\n        this.cos[i] = Math.cos(TWO_PI * i / n);\n        this.sin[i] = Math.sin(TWO_PI * i / n);\n      }\n      this.rev = new Uint32Array(n);\n      for (let i = 0; i < n; i++) {\n        let r = 0, x = i;\n        for (let b = 0; b < levels; b++) { r = (r << 1) | (x & 1); x >>= 1; }\n        this.rev[i] = r;\n      }\n    }\n    // \u043f\u0440\u044f\u043c\u043e\u0435: X[k] = sum x[n] e^{-i2\u03c0kn/N}; \u043e\u0431\u0440\u0430\u0442\u043d\u043e\u0435 \u0432\u043a\u043b\u044e\u0447\u0430\u0435\u0442 \u0434\u0435\u043b\u0435\u043d\u0438\u0435 \u043d\u0430 N\n    transform(re, im, inverse) {\n      const n = this.n, rev = this.rev, cosT = this.cos, sinT = this.sin;\n      for (let i = 0; i < n; i++) {\n        const j = rev[i];\n        if (j > i) {\n          let t = re[i]; re[i] = re[j]; re[j] = t;\n          t = im[i]; im[i] = im[j]; im[j] = t;\n        }\n      }\n      const sgn = inverse ? 1 : -1;\n      for (let size = 2; size <= n; size <<= 1) {\n        const half = size >> 1, step = n / size;\n        for (let i = 0; i < n; i += size) {\n          for (let j = i, k = 0; j < i + half; j++, k += step) {\n            const wr = cosT[k], wi = sgn * sinT[k];\n            const l = j + half;\n            const tr = re[l] * wr - im[l] * wi;\n            const ti = re[l] * wi + im[l] * wr;\n            re[l] = re[j] - tr; im[l] = im[j] - ti;\n            re[j] += tr; im[j] += ti;\n          }\n        }\n      }\n      if (inverse) {\n        const s = 1 / n;\n        for (let i = 0; i < n; i++) { re[i] *= s; im[i] *= s; }\n      }\n    }\n  }\n\n  /* ------------------------------------------------------------------ */\n  /* VoiceCore \u2014 \u043f\u0440\u0435\u043e\u0431\u0440\u0430\u0437\u043e\u0432\u0430\u043d\u0438\u0435 \u0442\u0435\u043c\u0431\u0440\u0430                                   */\n  /* ------------------------------------------------------------------ */\n  /** \u0418\u043d\u0434\u0435\u043a\u0441 \u043c\u0438\u043d\u0438\u043c\u0443\u043c\u0430 \u0430\u043c\u043f\u043b\u0438\u0442\u0443\u0434\u044b \u043c\u0435\u0436\u0434\u0443 \u0434\u0432\u0443\u043c\u044f \u043f\u0438\u043a\u0430\u043c\u0438 \u2014 \u0433\u0440\u0430\u043d\u0438\u0446\u0430 \u00ab\u0437\u043e\u043d \u0432\u043b\u0438\u044f\u043d\u0438\u044f\u00bb. */\n  function valley(a, p, q) {\n    let b = p + 1, m = a[b];\n    for (let i = p + 1; i < q; i++) if (a[i] < m) { m = a[i]; b = i; }\n    return b;\n  }\n\n  class VoiceCore {\n    /**\n     * @param {number} sampleRate\n     * @param {{windowMs?: number}} opts  \u0434\u043b\u0438\u043d\u0430 \u043e\u043a\u043d\u0430 \u0430\u043d\u0430\u043b\u0438\u0437\u0430, \u043c\u0441 (21 \u2014 \u043c\u0430\u043b\u0430\u044f \u0437\u0430\u0434\u0435\u0440\u0436\u043a\u0430, 43 \u2014 \u043a\u0430\u0447\u0435\u0441\u0442\u0432\u043e)\n     */\n    constructor(sampleRate, opts) {\n      opts = opts || {};\n      this.sr = sampleRate;\n      const ms = opts.windowMs || 43;\n      const N = Math.pow(2, Math.round(Math.log2(sampleRate * ms / 1000)));\n      this.N = Math.max(256, Math.min(8192, N));\n      this.osamp = opts.osamp || 4;\n      this.lock = opts.lock !== false;          // \u0444\u0430\u0437\u043e\u0432\u0430\u044f \u043f\u0440\u0438\u0432\u044f\u0437\u043a\u0430 \u0433\u0430\u0440\u043c\u043e\u043d\u0438\u043a (\u0447\u0438\u0449\u0435 \u0437\u0432\u0443\u043a)\n      this.unvoicedNoise = opts.unvoiced !== false; // \u0448\u0438\u043f\u044f\u0449\u0438\u0435 \u0438 \u00ab\u0441/\u0448/\u0444\u00bb \u0441\u0438\u043d\u0442\u0435\u0437\u0438\u0440\u0443\u044e\u0442\u0441\u044f \u043a\u0430\u043a \u0448\u0443\u043c, \u0430 \u043d\u0435 \u043a\u0430\u043a \u0442\u043e\u043d\n      this.Ha = this.N / this.osamp;\n      this.half = this.N / 2;\n      this.fft = new FFT(this.N);\n\n      const N_ = this.N, half = this.half;\n      this.win = new Float64Array(N_);\n      let s2 = 0;\n      for (let i = 0; i < N_; i++) {\n        this.win[i] = 0.5 - 0.5 * Math.cos(TWO_PI * i / N_);\n        s2 += this.win[i] * this.win[i];\n      }\n      this.winSq = s2;\n\n      this.re = new Float64Array(N_);\n      this.im = new Float64Array(N_);\n      this.cre = new Float64Array(N_);\n      this.cim = new Float64Array(N_);\n      this.lastPhase = new Float64Array(half + 1);\n      this.sumPhase = new Float64Array(half + 1);\n      this.anaPhase = new Float64Array(half + 1);\n      this.trueFreq = new Float64Array(half + 1);\n      this.logMag = new Float64Array(half + 1);\n      this.logEnv = new Float64Array(half + 1);\n      this.white = new Float64Array(half + 1);\n      this.synFreq = new Float64Array(half + 1);\n      this.frameOut = new Float64Array(N_);\n      this.shape = new Float64Array(half + 1);   // \u0434\u043e\u0431\u0430\u0432\u043a\u0430 \u043a \u043b\u043e\u0433\u0430\u0440\u0438\u0444\u043c\u0443 \u043e\u0433\u0438\u0431\u0430\u044e\u0449\u0435\u0439 (\u0433\u043b\u0443\u0431\u0438\u043d\u0430/\u044f\u0440\u043a\u043e\u0441\u0442\u044c)\n      this.breathW = new Float64Array(half + 1); // \u0432\u0435\u0441 \u0441\u043b\u0443\u0447\u0430\u0439\u043d\u043e\u0439 \u0444\u0430\u0437\u044b \u043f\u043e \u0447\u0430\u0441\u0442\u043e\u0442\u0435\n      this.unvW = new Float64Array(half + 1);    // \u0432\u0435\u0441 \u0441\u043b\u0443\u0447\u0430\u0439\u043d\u043e\u0439 \u0444\u0430\u0437\u044b \u0434\u043b\u044f \u0431\u0435\u0437\u0433\u043e\u043b\u043e\u0441\u044b\u0445 \u0437\u0432\u0443\u043a\u043e\u0432\n      this.synMag = new Float64Array(half + 1);\n      this.synPh = new Float64Array(half + 1);\n      this.peaks = new Int32Array(half + 1);\n      this.vSm = 0; this.seed = 123456789;          // \u00ab\u0433\u043e\u043b\u043e\u0441\u043e\u0432\u043e\u0441\u0442\u044c\u00bb \u043a\u0430\u0434\u0440\u0430 (0 \u2014 \u0448\u0443\u043c, 1 \u2014 \u0447\u0438\u0441\u0442\u044b\u0439 \u0442\u043e\u043d), \u0441\u0433\u043b\u0430\u0436\u0435\u043d\u043d\u0430\u044f\n      this.f0ref = 0;        // \u043c\u0435\u0434\u043b\u0435\u043d\u043d\u043e \u043c\u0435\u043d\u044f\u044e\u0449\u0430\u044f\u0441\u044f \u00ab\u0441\u0440\u0435\u0434\u043d\u044f\u044f\u00bb \u0432\u044b\u0441\u043e\u0442\u0430 \u0433\u043e\u0432\u043e\u0440\u044f\u0449\u0435\u0433\u043e (log2 \u0413\u0446)\n      this.dev = 0;          // \u043e\u0442\u043a\u043b\u043e\u043d\u0435\u043d\u0438\u0435 \u0442\u0435\u043a\u0443\u0449\u0435\u0439 \u0432\u044b\u0441\u043e\u0442\u044b \u043e\u0442 \u0441\u0440\u0435\u0434\u043d\u0435\u0439 (\u043e\u043a\u0442\u0430\u0432\u044b)\n      this.drift = 0;        // \u043b\u0451\u0433\u043a\u0430\u044f \u0441\u043b\u0443\u0447\u0430\u0439\u043d\u0430\u044f \u0436\u0438\u0432\u043e\u0441\u0442\u044c\n      this.ratioEff = 1;\n\n      // \u043a\u0435\u043f\u0441\u0442\u0440\u0430\u043b\u044c\u043d\u044b\u0439 \u00ab\u043b\u0438\u0444\u0442\u0435\u0440\u00bb: \u0447\u0435\u043c \u0431\u043e\u043b\u044c\u0448\u0435, \u0442\u0435\u043c \u043f\u043e\u0434\u0440\u043e\u0431\u043d\u0435\u0435 \u043e\u0433\u0438\u0431\u0430\u044e\u0449\u0430\u044f\n      this.lifter = Math.max(8, Math.round(sampleRate / 700));       // \u0434\u043b\u044f \u0431\u0435\u0437\u0433\u043e\u043b\u043e\u0441\u044b\u0445 \u0437\u0432\u0443\u043a\u043e\u0432\n      this.lifterMin = Math.max(8, Math.round(sampleRate / 900));\n      this.lifterMax = Math.max(this.lifterMin + 1, Math.round(sampleRate / 150));\n      this.qLo = Math.max(10, Math.floor(sampleRate / 400));         // \u043f\u043e\u0438\u0441\u043a \u043f\u0435\u0440\u0438\u043e\u0434\u0430 \u043e\u0441\u043d\u043e\u0432\u043d\u043e\u0433\u043e \u0442\u043e\u043d\u0430 60..400 \u0413\u0446\n      this.qHi = Math.min(this.half - 2, Math.ceil(sampleRate / 60));\n\n      const binHz = sampleRate / N_;\n      this.binHz = binHz;\n      for (let k = 0; k <= half; k++) {\n        const f = k * binHz;\n        this.breathW[k] = Math.max(0, Math.min(1, (f - 200) / 1000));\n        this.unvW[k] = Math.max(0, Math.min(1, (f - 400) / 1500));\n      }\n\n      // \u043f\u043e\u0442\u043e\u043a\u043e\u0432\u044b\u0435 \u0431\u0443\u0444\u0435\u0440\u044b\n      this.latency = this.N - this.Ha;\n      this.inFifo = new Float32Array(this.N);\n      this.outFifo = new Float32Array(this.Ha);\n      this.accum = new Float64Array(this.N);\n      this.rover = this.latency;\n      this.primed = false;\n\n      this.params = mergeParams();\n      this.setParams(this.params);\n    }\n\n    setParams(p) {\n      const q = this.params = mergeParams(p);\n      this.ratio = Math.pow(2, q.pitch / 12);\n      this.fratio = Math.pow(2, q.formant / 12);\n      this.breath = Math.max(0, Math.min(1, q.breath));\n      this.lively = Math.max(0, Math.min(1.5, q.lively));\n      const half = this.half, binHz = this.binHz;\n      const LN10_20 = Math.LN10 / 20;\n      for (let k = 0; k <= half; k++) {\n        const f = Math.max(k * binHz, 60);\n        let db = 0;\n        // \u044f\u0440\u043a\u043e\u0441\u0442\u044c: \u043d\u0430\u043a\u043b\u043e\u043d \u0441\u043f\u0435\u043a\u0442\u0440\u0430 \u0434\u043e \u00b16 \u0434\u0411/\u043e\u043a\u0442. \u043e\u0442\u043d\u043e\u0441\u0438\u0442\u0435\u043b\u044c\u043d\u043e 1 \u043a\u0413\u0446\n        db += (q.tilt * 6) * Math.log2(f / 1000);\n        // \u0433\u043b\u0443\u0431\u0438\u043d\u0430: \u0431\u0430\u0441 \u0432\u0432\u0435\u0440\u0445, \u0432\u0435\u0440\u0445 \u0432\u043d\u0438\u0437\n        const lo = 1 / (1 + Math.pow(f / 300, 2));\n        const hiR = Math.pow(f / 3500, 2);\n        db += q.depth * (10 * lo - 7 * hiR / (1 + hiR));\n        this.shape[k] = db * LN10_20;\n      }\n    }\n\n    _rnd() { // \u0434\u0435\u0442\u0435\u0440\u043c\u0438\u043d\u0438\u0440\u043e\u0432\u0430\u043d\u043d\u044b\u0439 \u0433\u0435\u043d\u0435\u0440\u0430\u0442\u043e\u0440: \u0440\u0435\u0437\u0443\u043b\u044c\u0442\u0430\u0442 \u043d\u0435 \u0437\u0430\u0432\u0438\u0441\u0438\u0442 \u043e\u0442 \u0440\u0430\u0437\u043c\u0435\u0440\u0430 \u0431\u043b\u043e\u043a\u043e\u0432\n      let x = this.seed | 0; x ^= x << 13; x ^= x >>> 17; x ^= x << 5; this.seed = x;\n      return ((x >>> 0) % 1000003) / 1000003;\n    }\n\n    reset() {\n      this.inFifo.fill(0); this.outFifo.fill(0); this.accum.fill(0);\n      this.lastPhase.fill(0); this.sumPhase.fill(0);\n      this.vSm = 0; this.f0ref = 0; this.dev = 0; this.drift = 0; this.seed = 123456789;\n      this.rover = this.latency; this.primed = false;\n    }\n\n    /** \u041e\u0434\u0438\u043d \u043a\u0430\u0434\u0440: inFrame (N \u043e\u0442\u0441\u0447\u0451\u0442\u043e\u0432) -> this.frameOut (N, \u0443\u0436\u0435 \u0441 \u043e\u043a\u043d\u043e\u043c \u0438 \u043d\u043e\u0440\u043c\u0438\u0440\u043e\u0432\u043a\u043e\u0439). hopS \u2014 \u0448\u0430\u0433 \u0441\u0438\u043d\u0442\u0435\u0437\u0430. */\n    _frame(inFrame, hopS) {\n      const N = this.N, half = this.half, re = this.re, im = this.im, win = this.win;\n      const lastPhase = this.lastPhase, sumPhase = this.sumPhase, anaPhase = this.anaPhase;\n      const trueFreq = this.trueFreq, logMag = this.logMag, logEnv = this.logEnv;\n      const white = this.white, synFreq = this.synFreq, shape = this.shape;\n      const cre = this.cre, cim = this.cim;\n      const osamp = this.osamp, fr = this.fratio;\n      let ratio = this.ratio;   // \u0443\u0442\u043e\u0447\u043d\u044f\u0435\u0442\u0441\u044f \u043d\u0438\u0436\u0435: \u00ab\u0436\u0438\u0432\u043e\u0441\u0442\u044c\u00bb \u043c\u0435\u043d\u044f\u0435\u0442 \u0432\u044b\u0441\u043e\u0442\u0443 \u043e\u0442 \u043a\u0430\u0434\u0440\u0430 \u043a \u043a\u0430\u0434\u0440\u0443\n\n      for (let i = 0; i < N; i++) { re[i] = inFrame[i] * win[i]; im[i] = 0; }\n      this.fft.transform(re, im, false);\n\n      // ---- \u0430\u043d\u0430\u043b\u0438\u0437: \u0430\u043c\u043f\u043b\u0438\u0442\u0443\u0434\u0430, \u0438\u0441\u0442\u0438\u043d\u043d\u0430\u044f \u0447\u0430\u0441\u0442\u043e\u0442\u0430 \u043a\u0430\u0436\u0434\u043e\u0439 \u0433\u0430\u0440\u043c\u043e\u043d\u0438\u043a\u0438 ----\n      const expct = TWO_PI * this.Ha / N;\n      const primed = this.primed;\n      for (let k = 0; k <= half; k++) {\n        const r = re[k], m = im[k];\n        const mag = Math.sqrt(r * r + m * m);\n        const ph = Math.atan2(m, r);\n        anaPhase[k] = ph;\n        logMag[k] = Math.log(mag + 1e-9);\n        if (primed) {\n          let d = ph - lastPhase[k] - k * expct;\n          d -= TWO_PI * Math.round(d / TWO_PI);\n          trueFreq[k] = k + d * osamp / TWO_PI;\n        } else {\n          trueFreq[k] = k;\n        }\n        lastPhase[k] = ph;\n      }\n\n      // ---- \u043e\u0433\u0438\u0431\u0430\u044e\u0449\u0430\u044f \u0441\u043f\u0435\u043a\u0442\u0440\u0430 (\u0444\u043e\u0440\u043c\u0430\u043d\u0442\u044b) \u0447\u0435\u0440\u0435\u0437 \u043a\u0435\u043f\u0441\u0442\u0440 ----\n      for (let k = 0; k <= half; k++) { cre[k] = logMag[k]; cim[k] = 0; }\n      for (let k = 1; k < half; k++) { cre[N - k] = logMag[k]; cim[N - k] = 0; }\n      this.fft.transform(cre, cim, true);\n      // \u0414\u043b\u0438\u043d\u0430 \u043a\u0435\u043f\u0441\u0442\u0440\u0430\u043b\u044c\u043d\u043e\u0433\u043e \u0444\u0438\u043b\u044c\u0442\u0440\u0430 \u043f\u043e\u0434\u0431\u0438\u0440\u0430\u0435\u0442\u0441\u044f \u043f\u043e\u0434 \u0432\u044b\u0441\u043e\u0442\u0443 \u0433\u043e\u043b\u043e\u0441\u0430 \u0432 \u044d\u0442\u043e\u043c \u043a\u0430\u0434\u0440\u0435:\n      // \u0433\u0430\u0440\u043c\u043e\u043d\u0438\u043a\u0438 \u0434\u0430\u044e\u0442 \u043f\u0438\u043a \u0432 \u043a\u0435\u043f\u0441\u0442\u0440\u0435 \u043d\u0430 \u00ab\u043f\u0435\u0440\u0438\u043e\u0434\u0435 \u043e\u0441\u043d\u043e\u0432\u043d\u043e\u0433\u043e \u0442\u043e\u043d\u0430\u00bb. \u0424\u0438\u043b\u044c\u0442\u0440 \u043a\u043e\u0440\u043e\u0447\u0435 \u044d\u0442\u043e\u0433\u043e \u043f\u0438\u043a\u0430,\n      // \u043f\u043e\u044d\u0442\u043e\u043c\u0443 \u043e\u0433\u0438\u0431\u0430\u044e\u0449\u0430\u044f \u043f\u043e\u043b\u0443\u0447\u0430\u0435\u0442\u0441\u044f \u043f\u043e\u0434\u0440\u043e\u0431\u043d\u043e\u0439 (\u0444\u043e\u0440\u043c\u0430\u043d\u0442\u044b \u0440\u0430\u0437\u043b\u0438\u0447\u0438\u043c\u044b), \u043d\u043e \u0431\u0435\u0437 \u0433\u0430\u0440\u043c\u043e\u043d\u0438\u043a.\n      let L = this.lifter, qpk = 0, vpk = 0.12;\n      for (let q = this.qLo; q <= this.qHi; q++) {\n        const c = cre[q];\n        if (c > vpk && c >= cre[q - 1] && c >= cre[q + 1]) { vpk = c; qpk = q; }\n      }\n      if (qpk > 0) L = Math.max(this.lifterMin, Math.min(this.lifterMax, Math.floor(0.8 * qpk)));\n\n      // ---- \u0433\u043e\u043b\u043e\u0441\u043e\u0432\u043e\u0441\u0442\u044c \u0438 \u0432\u044b\u0441\u043e\u0442\u0430 \u0433\u043e\u043b\u043e\u0441\u0430 \u0432 \u044d\u0442\u043e\u043c \u043a\u0430\u0434\u0440\u0435 (\u043f\u043e \u0442\u043e\u043c\u0443 \u0436\u0435 \u043a\u0435\u0
