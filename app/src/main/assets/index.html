// Хранилище: библиотека NPC и настройки (localStorage), тестовая фраза (IndexedDB),
// резервная копия (экспорт/импорт JSON).

const LIB_KEY = 'vdnd.library.v1';
const SET_KEY = 'vdnd.settings.v1';
const memory = {};

function lsGet(key) {
  try { return localStorage.getItem(key); } catch { return memory[key] ?? null; }
}
function lsSet(key, val) {
  try { localStorage.setItem(key, val); } catch { memory[key] = val; }
  idbPut(key, val);   // вторая копия: если браузер очистит localStorage, данные вернутся из IndexedDB
}
function hasSavedLibrary() { return !!lsGet(LIB_KEY); }

const DEFAULT_SETTINGS = {
  mode: 'live',          // 'live' — потоково, 'phrase' — по фразам
  autoplay: true,        // автоматически воспроизводить результат
  monitor: 'converted',  // что слышно в живом режиме: 'converted' | 'original'
  selectedId: null,
  filter: 'all',         // 'all' | 'fav' | название категории
  sort: 'manual',        // 'manual' | 'name' | 'category' | 'recent'
  inputId: '',
  gateDb: -45,
  quality: 'quality',    // 'fast' — окно ~21 мс, 'quality' — ~43 мс
  schema: 2,             // версия настроек (для обновлений)
  echoCancellation: false, // выключено: сильно задерживает звук; включайте только если есть «эхо» из динамика
  noiseSuppression: false,
  fxEnabled: true,       // эхо / рычание / хрипота
  masterVolume: 1,
  phraseHangMs: 700,
  fallbackDsp: true
};

function newId() {
  return 'npc-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
}

function defaultNpc(partial) {
  return Object.assign({
    id: newId(), name: 'Новый NPC', voiceName: '', kind: '', gender: '', category: 'Другие', desc: '',
    avatar: { type: 'emoji', value: '🎭' }, favorite: false, engine: 'dsp', model: '',
    params: { pitch: 0, formant: 0, depth: 0, tilt: 0, breath: 0, growl: 0, echo: 0, speed: 1, volume: 1, lively: 0, layer: 0 },
    order: 0, lastUsed: 0, builtin: false
  }, partial || {});
}

function loadLibrary() {
  try {
    const raw = lsGet(LIB_KEY);
    if (raw) {
      const list = JSON.parse(raw);
      if (Array.isArray(list) && list.length) return list.map(normalizeNpc);
    }
  } catch { /* повреждённые данные — начнём с демо */ }
  return DEMO_NPCS.map(n => normalizeNpc(JSON.parse(JSON.stringify(n))));
}

function saveLibrary(list) { lsSet(LIB_KEY, JSON.stringify(list)); }

function normalizeNpc(n) {
  const d = defaultNpc();
  const out = Object.assign({}, d, n);
  out.params = Object.assign({}, d.params, (n && n.params) || {});
  out.avatar = (n && n.avatar && n.avatar.value) ? n.avatar : d.avatar;
  if (typeof out.id !== 'string' || !out.id) out.id = newId();
  return out;
}

function loadSettings() {
  try {
    const raw = lsGet(SET_KEY);
    if (raw) {
      const st = Object.assign({}, DEFAULT_SETTINGS, JSON.parse(raw));
      if (!(st.schema >= 2)) { st.schema = 2; st.echoCancellation = false; st.noiseSuppression = false; st.migrated = true; }
      return st;
    }
  } catch { /* значения по умолчанию */ }
  return Object.assign({}, DEFAULT_SETTINGS);
}

function markRemoved(id) { if (String(id).startsWith('demo-')) lsSet('vdnd.removed.' + id, '1'); }

/** Обновление сохранённой библиотеки: новые шаблоны и улучшенные женские голоса (если вы их не меняли). */
function upgradeLibrary(list) {
  let changed = false;
  const same = (a, b) => Object.keys(b).every((k) => Math.abs((a[k] == null ? 0 : a[k]) - b[k]) < 1e-9);
  for (const demo of DEMO_NPCS) {
    const cur = list.find((x) => x.id === demo.id);
    if (!cur) {
      if (!lsGet('vdnd.removed.' + demo.id)) { list.push(normalizeNpc(JSON.parse(JSON.stringify(Object.assign({}, demo, { order: list.length, favorite: false }))))); changed = true; }
    } else if (OLD_FEMALE[demo.id] && same(cur.params, OLD_FEMALE[demo.id]) && !(cur.params.lively > 0)) {
      cur.params = Object.assign({}, cur.params, demo.params); changed = true;
    }
  }
  return changed;
}
function saveSettings(s) { lsSet(SET_KEY, JSON.stringify(s)); }

/* ---------- резервная копия ---------- */
function exportBackup(list, settings) {
  return JSON.stringify({ app: 'voice-dnd', version: 1, exported: new Date().toISOString(), npcs: list, settings }, null, 1);
}
function exportNpc(npc) {
  return JSON.stringify({ app: 'voice-dnd', version: 1, npcs: [npc] }, null, 1);
}
/** Возвращает массив NPC из файла. Бросает ошибку, если файл не подходит. */
function parseBackup(text) {
  let data;
  try { data = JSON.parse(text); } catch { throw new Error('Файл не похож на резервную копию (это не JSON).'); }
  if (!data || data.app !== 'voice-dnd' || !Array.isArray(data.npcs)) throw new Error('Это не файл из этого приложения.');
  return { npcs: data.npcs.map(normalizeNpc), settings: data.settings || null };
}

/* ---------- IndexedDB: зеркальная копия и тестовая фраза ---------- */
function idbPut(key, val) {
  idb().then((db) => { const tx = db.transaction('kv', 'readwrite'); tx.objectStore('kv').put(val, 'mirror:' + key); }).catch(() => { /* не критично */ });
}
async function idbGet(key) {
  try {
    const db = await idb();
    return await new Promise((res) => { const q = db.transaction('kv').objectStore('kv').get('mirror:' + key); q.onsuccess = () => res(q.result || null); q.onerror = () => res(null); });
  } catch { return null; }
}
/** Если localStorage пуст (очищен браузером), пробуем вернуть данные из IndexedDB. */
async function recoverFromMirror() {
  const lib = await idbGet(LIB_KEY), set = await idbGet(SET_KEY);
  let out = null;
  try { if (lib) { const l = JSON.parse(lib); if (Array.isArray(l) && l.length) { out = { library: l.map(normalizeNpc) }; lsSet(LIB_KEY, lib); } } } catch { /* битые данные */ }
  try { if (set) { out = out || {}; out.settings = Object.assign({}, DEFAULT_SETTINGS, JSON.parse(set)); lsSet(SET_KEY, set); } } catch { /* битые данные */ }
  return out;
}
/** Просим браузер не удалять данные приложения. */
async function requestPersistent() { try { return navigator.storage && navigator.storage.persist ? await navigator.storage.persist() : false; } catch { return false; } }
function idb() {
  return new Promise((resolve, reject) => {
    const r = indexedDB.open('vdnd', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('kv');
    r.onsuccess = () => resolve(r.result);
    r.onerror = () => reject(r.error);
  });
}
async function saveTestPhrase(obj) {
  try {
    const db = await idb();
    await new Promise((res, rej) => { const tx = db.transaction('kv', 'readwrite'); tx.objectStore('kv').put(obj, 'testPhrase'); tx.oncomplete = res; tx.onerror = () => rej(tx.error); });
  } catch { /* без сохранения: фраза останется до закрытия страницы */ }
}
async function loadTestPhrase() {
  try {
    const db = await idb();
    return await new Promise((res, rej) => { const tx = db.transaction('kv'); const q = tx.objectStore('kv').get('testPhrase'); q.onsuccess = () => res(q.result || null); q.onerror = () => rej(q.error); });
  } catch { return null; }
}

// Клиент сервера на компьютере: нейросетевое преобразование (RVC и др.) по фразам.
// Работает только если приложение открыто с адреса, который показал компьютер (тот же сервер).

class RemoteClient {
  constructor() { this.status = null; }

  async probe() {
    // Android offline build: remote engines are intentionally disabled.
    this.status = null;
    return null;
  }

  engineReady(name) {
    return !!(this.status && this.status.engines && this.status.engines[name] && this.status.engines[name].available);
  }

  /** Серверное преобразование отключено в автономной Android-версии. */
  async convert() {
    throw new Error('В автономной версии доступны только локальные DSP-эффекты.');
  }
}

function encodeWav(f32, sr) {
  const n = f32.length, buf = new ArrayBuffer(44 + n * 2), v = new DataView(buf);
  const w = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
  w(0, 'RIFF'); v.setUint32(4, 36 + n * 2, true); w(8, 'WAVE'); w(12, 'fmt ');
  v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, sr, true); v.setUint32(28, sr * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);
  w(36, 'data'); v.setUint32(40, n * 2, true);
  for (let i = 0; i < n; i++) { const s = Math.max(-1, Math.min(1, f32[i])); v.setInt16(44 + i * 2, s < 0 ? s * 0x8000 : s * 0x7fff, true); }
  return buf;
}

function decodeWav(buf) {
  const v = new DataView(buf);
  const tag = (o) => String.fromCharCode(v.getUint8(o), v.getUint8(o + 1), v.getUint8(o + 2), v.getUint8(o + 3));
  if (buf.byteLength < 44 || tag(0) !== 'RIFF' || tag(8) !== 'WAVE') throw new Error('Сервер вернул не WAV');
  let o = 12, fmt = null, dataOff = 0, dataLen = 0;
  while (o + 8 <= buf.byteLength) {
    const id = tag(o), len = v.getUint32(o + 4, true);
    if (id === 'fmt ') fmt = { code: v.getUint16(o + 8, true), ch: v.getUint16(o + 10, true), sr: v.getUint32(o + 12, true), bits: v.getUint16(o + 22, true) };
    if (id === 'data') { dataOff = o + 8; dataLen = Math.min(len, buf.byteLength - dataOff); break; }
    o += 8 + len + (len & 1);
  }
  if (!fmt || !dataOff) throw new Error('Не удалось прочитать WAV');
  const bytes = fmt.bits / 8, frames = Math.floor(dataLen / (bytes * fmt.ch)), out = new Float32Array(frames);
  for (let i = 0; i < frames; i++) {
    const p = dataOff + i * bytes * fmt.ch;
    out[i] = fmt.code === 3 ? v.getFloat32(p, true) : fmt.bits === 16 ? v.getInt16(p, true) / 32768 : fmt.bits === 8 ? (v.getUint8(p) - 128) / 128 : v.getInt32(p, true) / 2147483648;
  }
  return { data: out, sr: fmt.sr };
}

// AudioEngine — всё, что связано со звуком: микрофон, обработка, воспроизведение.
//
// Два режима работы:
//  • «Живой»  — звук идёт через AudioWorklet потоково (задержка = окно анализа ≈ 21/43 мс + задержка устройства).
//  • «Фразы»  — приложение слушает, ловит фразу целиком (по паузе), обрабатывает и проигрывает.
//               Этот режим нужен для нейросети (RVC) и для изменения скорости речи.
//               Пока играет ответ, микрофон «не слушает» — обратной связи нет по определению.

const QUALITY_MS = { fast: 21, quality: 43 };
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const rmsOf = (a) => { let s = 0; for (let i = 0; i < a.length; i++) s += a[i] * a[i]; return Math.sqrt(s / (a.length || 1)); };

function fail(code, message) { const e = new Error(message); e.code = code; return e; }

class AudioEngine extends EventTarget {
  constructor() {
    super();
    this.ctx = null; this.node = null; this.src = null; this.stream = null;
    this.liveGain = null; this.out = null;
    this.settings = null; this.voice = null;
    this.running = false; this.recording = false;
    this.remote = new RemoteClient();
    this.testPhrase = null; this.lastPhrase = null;
    this._workletReady = false; this._busy = false; this._playing = false; this._ignoreUntil = 0;
    this._source = null; this._chunks = null; this._wake = null; this._fbMuted = false;
    this._calib = null; this._vad = null; this._resetVad();
  }

  emit(type, detail) { this.dispatchEvent(new CustomEvent(type, { detail })); }

  /* ---------------- состояние ---------------- */
  effectiveMode() {
    if (this.voice && this.voice.engine && this.voice.engine !== 'dsp') return 'phrase';
    return (this.settings && this.settings.mode) || 'live';
  }
  state() {
    return {
      running: this.running, mode: this.effectiveMode(), feedback: this._fbMuted,
      busy: this._busy, playing: this._playing, recording: this.recording,
      speech: this._vad.state === 'speech', hasLast: !!this.lastPhrase
    };
  }
  latencyMs() {
    if (!this.ctx) return null;
    const sr = this.ctx.sampleRate, ms = QUALITY_MS[this.settings.quality] || 43;
    const N = Math.pow(2, Math.round(Math.log2(sr * ms / 1000)));
    return Math.round(N / sr * 1000 + (this.ctx.baseLatency || 0) * 1000 + (this.ctx.outputLatency || 0) * 1000);
  }

  /* ---------------- контекст и микрофон ---------------- */
  async _ensureBasicContext() {
    if (!this.ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) throw fail('NoAudio', 'Этот браузер не поддерживает Web Audio.');
      this.ctx = new AC({ latencyHint: 'interactive' });
      this.out = this.ctx.createGain();
      this.liveGain = this.ctx.createGain();
      this.liveGain.connect(this.out);
      this.out.connect(this.ctx.destination);
    }
    if (this.ctx.state === 'suspended') await this.ctx.resume();
    this._applyGains();
  }

  async _ensureContext() {
    await this._ensureBasicContext();
    if (!this._workletReady) {
      if (!this.ctx.audioWorklet) throw fail('NoWorklet', 'Браузер не поддерживает AudioWorklet. Нужен свежий Chrome/Edge (Android) или Safari 14.5+ и защищённое соединение (HTTPS).');
      if (window.VDND_WORKLET_SRC) {   // единый HTML-файл: код процессора встроен в страницу
        // Из файла, открытого с диска (file://), blob-ссылки не грузятся, поэтому data-ссылка.
        const bytes = new TextEncoder().encode(window.VDND_WORKLET_SRC);
        let bin = ''; for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
        const dataUrl = 'data:text/javascript;base64,' + btoa(bin);
        try { await this.ctx.audioWorklet.addModule(dataUrl); }
        catch (e1) {
          const url = URL.createObjectURL(new Blob([window.VDND_WORKLET_SRC], { type: 'text/javascript' }));
          try { await this.ctx.audioWorklet.addModule(url); } finally { URL.revokeObjectURL(url); }
        }
      } else {
        await this.ctx.audioWorklet.addModule('js/audio/dsp-core.js');
        await this.ctx.audioWorklet.addModule('js/audio/worklet.js');
      }
      this._workletReady = true;
    }
    this._applyGains();
  }

  async _openMic() {
    await this._ensureContext();
    if (this.stream && this.node) return;
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      throw fail('Insecure', 'Микрофон недоступен: страница открыта не по HTTPS. Откройте адрес https://… (см. инструкцию).');
    }
    const s = this.settings;
    const audio = { echoCancellation: !!s.echoCancellation, noiseSuppression: !!s.noiseSuppression, autoGainControl: false, channelCount: 1 };
    if (s.inputId) audio.deviceId = { ideal: s.inputId };
    try { this.stream = await navigator.mediaDevices.getUserMedia({ audio }); }
    catch (e1) {
      // некоторые оболочки (WebView) не принимают часть настроек: пробуем самые простые
      if (e1 && (e1.name === 'NotReadableError' || e1.name === 'OverconstrainedError' || e1.name === 'AbortError')) {
        try { this.stream = await navigator.mediaDevices.getUserMedia({ audio: true }); } catch (e2) { throw e2; }
      } else throw e1;
    }
    const track = this.stream.getAudioTracks()[0];
    track.addEventListener('ended', () => { this.emit('error', { code: 'MicLost', message: 'Микрофон отключился (его мог забрать другой звонок или приложение).' }); this.stop(); });
    this._buildNode();
  }

  _buildNode() {
    if (this.node) { try { this.node.disconnect(); } catch { /* уже отключён */ } this.node.port.onmessage = null; }
    if (this.src) { try { this.src.disconnect(); } catch { /* уже отключён */ } }
    const windowMs = QUALITY_MS[this.settings.quality] || 43;
    this._nodeWindowMs = windowMs;
    this.src = this.ctx.createMediaStreamSource(this.stream);
    this.node = new AudioWorkletNode(this.ctx, 'vc-processor', {
      numberOfInputs: 1, numberOfOutputs: 1, outputChannelCount: [1],
      processorOptions: { windowMs, gateDb: this.settings.gateDb }
    });
    this.node.port.onmessage = (e) => this._onNodeMessage(e.data || {});
    this.src.connect(this.node);
    this.node.connect(this.liveGain);
    this._pushVoice();
    this._applyMode();
  }

  _closeMic() {
    if (this.node) { try { this.node.disconnect(); } catch { /* ok */ } this.node.port.onmessage = null; this.node = null; }
    if (this.src) { try { this.src.disconnect(); } catch { /* ok */ } this.src = null; }
    if (this.stream) { this.stream.getTracks().forEach((t) => t.stop()); this.stream = null; }
    this._releaseWake();
  }

  _post(msg) { if (this.node) this.node.port.postMessage(msg); }

  /* ---------------- настройки и голос ---------------- */
  applySettings() {
    if (this.node && this._nodeWindowMs !== (QUALITY_MS[this.settings.quality] || 43)) this._buildNode();
    this._post({ type: 'gate', db: this.settings.gateDb });
    this._applyGains();
    this._pushVoice();
    this._applyMode();
    this.emit('state', this.state());
  }

  setVoice(npc) {
    this.voice = npc;
    this._pushVoice();
    this._applyMode();
    this._resetVad();
    this.emit('state', this.state());
  }

  _voiceParams(p) {
    const q = Object.assign({}, p);
    if (this.settings && !this.settings.fxEnabled) { q.echo = 0; q.growl = 0; q.breath = 0; }
    return q;
  }
  _pushVoice() { if (this.voice) this._post({ type: 'params', params: this._voiceParams(this.voice.params) }); }

  _applyGains() {
    if (!this.out) return;
    const s = this.settings, t = this.ctx.currentTime;
    this.out.gain.setTargetAtTime(Math.max(0, Math.min(2, s.masterVolume)), t, 0.02);
    const liveMuted = this.effectiveMode() === 'live' && !s.autoplay;
    this.liveGain.gain.setTargetAtTime(liveMuted ? 0 : 1, t, 0.02);
  }

  _applyMode() {
    if (!this.node) return;
    const em = this.effectiveMode();
    let convert = false, capture = false, bypass = false;
    if (this.recording) capture = true;
    else if (this.running) {
      if (em === 'live') { convert = true; bypass = this.settings.monitor === 'original'; }
      else capture = true;
    }
    this._post({ type: 'convert', value: convert });
    this._post({ type: 'capture', value: capture });
    this._post({ type: 'bypass', value: bypass });
    this._applyGains();
  }

  /* ---------------- запуск / остановка ---------------- */
  async start() {
    if (this.running) return;
    await this._openMic();
    this.running = true; this._fbMuted = false;
    this._post({ type: 'mute', value: false });
    this._resetVad();
    this._applyMode();
    this._acquireWake();
    this.emit('state', this.state());
  }

  stop() {
    this.running = false; this._stopPlayback(); this._resetVad();
    if (!this.recording) this._closeMic(); else this._applyMode();
    this.emit('state', this.state());
    this.emit('level', { inRms: 0, outRms: 0, gate: false });
  }

  unmute() { this._fbMuted = false; this._post({ type: 'mute', value: false }); this.emit('state', this.state()); }

  async _acquireWake() { try { if (navigator.wakeLock) this._wake = await navigator.wakeLock.request('screen'); } catch { /* не критично */ } }
  _releaseWake() { try { if (this._wake) this._wake.release(); } catch { /* ok */ } this._wake = null; }

  async listInputs() {
    try {
      const all = await navigator.mediaDevices.enumerateDevices();
      return all.filter((d) => d.kind === 'audioinput').map((d, i) => ({ id: d.deviceId, label: d.label || ('Микрофон ' + (i + 1)) }));
    } catch { return []; }
  }

  /* ---------------- сообщения от процессора ---------------- */
  _onNodeMessage(m) {
    if (m.type === 'meter') {
      if (this._calib) this._calib(m.inRms);
      this.emit('level', m);
    } else if (m.type === 'pcm') this._onPcm(m.data);
    else if (m.type === 'feedback') { this._fbMuted = true; this.emit('feedback', {}); this.emit('state', this.state()); }
  }

  /* ---------------- режим фраз: детектор речи ---------------- */
  _resetVad() { this._vad = { state: 'idle', pre: [], speech: [], quiet: 0, loud: 0, samples: 0 }; }

  _onPcm(chunk) {
    if (this.recording) { this._chunks.push(chunk); return; }
    if (!this.running || this.effectiveMode() !== 'phrase') return;
    if (this._busy || this._playing || performance.now() < this._ignoreUntil) { if (this._vad.state !== 'idle' || this._vad.pre.length) this._resetVad(); return; }
    const sr = this.ctx.sampleRate, thr = Math.pow(10, this.settings.gateDb / 20), rms = rmsOf(chunk), v = this._vad;
    const ms = chunk.length / sr * 1000;
    if (v.state === 'idle') {
      v.pre.push(chunk); if (v.pre.length > 10) v.pre.shift();
      v.loud = rms > thr ? v.loud + 1 : 0;
      if (v.loud >= 2) { v.state = 'speech'; v.speech = v.pre.slice(); v.pre = []; v.quiet = 0; v.samples = v.speech.reduce((a, c) => a + c.length, 0); this.emit('state', this.state()); }
    } else {
      v.speech.push(chunk); v.samples += chunk.length;
      v.quiet = rms > thr ? 0 : v.quiet + ms;
      if (v.quiet >= this.settings.phraseHangMs || v.samples / sr > 25) this._endPhrase();
    }
  }

  _endPhrase() {
    const v = this._vad, sr = this.ctx.sampleRate;
    const total = v.speech.reduce((a, c) => a + c.length, 0);
    const trimQuiet = Math.max(0, Math.round(v.quiet / 1000 * sr) - Math.round(0.15 * sr));
    const len = Math.max(0, total - trimQuiet), buf = new Float32Array(len);
    let o = 0; for (const c of v.speech) { const n = Math.min(c.length, len - o); if (n <= 0) break; buf.set(c.subarray(0, n), o); o += n; }
    this._resetVad(); this.emit('state', this.state());
    if (len / sr < 0.3) return;      // щелчок или кашель
    this._handlePhrase(buf, sr);
  }

  async _handlePhrase(buf, sr) {
    const voice = this.voice;
    this._busy = true; this.emit('state', this.state());
    try {
      const r = await this.convertBuffer(buf, sr, voice);
      this.lastPhrase = { orig: buf, sr, conv: r.data, convSr: r.sr };
      this.emit('phrase', { stage: 'ready', via: r.via });
      if (this.settings.autoplay) { this._busy = false; await this.playFloat(r.data, r.sr); }
    } catch (e) {
      this.emit('error', { code: 'Convert', message: 'Не удалось обработать фразу: ' + (e && e.message ? e.message : e) });
    } finally { this._busy = false; this._resetVad(); this.emit('state', this.state()); }
  }

  /* ---------------- преобразование буфера ---------------- */
  async convertBuffer(buf, sr, voice) {
    const p = this._voiceParams(voice.params);
    if (voice.engine && voice.engine !== 'dsp') {
      try {
        const r = await this.remote.convert(buf, sr, voice, voice.engine);
        const data = globalThis.VCDsp.finishPhrase(r.data, r.sr, { volume: p.volume, echo: p.echo, growl: p.growl });
        return { data, sr: r.sr, via: voice.engine };
      } catch (e) {
        if (!this.settings.fallbackDsp) throw e;
        this.emit('warn', { message: 'Нейросеть недоступна (' + (e.message || e) + '). Использован встроенный голос.' });
      }
    }
    await sleep(0);
    const data = globalThis.VCDsp.processPhrase(buf, sr, p, { windowMs: 43 });
    return { data, sr, via: 'dsp' };
  }

  /* ---------------- воспроизведение ---------------- */
  _stopPlayback() {
    if (this._source) { const s = this._source; this._source = null; try { s.onended = null; s.stop(); } catch { /* ok */ } }
    if (this._playing) { this._playing = false; if (this.node && !this._fbMuted) this._post({ type: 'mute', value: false }); }
  }

  async playFloat(data, sr) {
    await this._ensureBasicContext();
    this._stopPlayback();
    const buf = this.ctx.createBuffer(1, Math.max(1, data.length), sr);
    buf.copyToChannel(data, 0);
    const src = this.ctx.createBufferSource();
    src.buffer = buf; src.connect(this.out);
    this._source = src; this._playing = true;
    this._post({ type: 'mute', value: true });  // пока играет ответ — живой тракт молчит (нет петли)
    this.emit('state', this.state());
    return new Promise((resolve) => {
      src.onended = () => {
        if (this._source === src) {
          this._source = null; this._playing = false; this._ignoreUntil = performance.now() + 350;
          if (!this._fbMuted) this._post({ type: 'mute', value: false });
          this.emit('state', this.state());
        }
        resolve();
      };
      src.start();
    });
  }

  async playLast(which) {
    const l = this.lastPhrase; if (!l) return false;
    if (which === 'orig') await this.playFloat(l.orig, l.sr); else await this.playFloat(l.conv, l.convSr);
    return true;
  }

  /* ---------------- фраза из файла (запись штатным диктофоном телефона) ---------------- */
  async processFile(arrayBuffer, voice) {
    await this._ensureBasicContext();
    const ab = await new Promise((res, rej) => { const p = this.ctx.decodeAudioData(arrayBuffer, res, rej); if (p && p.catch) p.catch(rej); });
    const ch = ab.numberOfChannels, n = ab.length, mono = new Float32Array(n);
    for (let c = 0; c < ch; c++) { const d = ab.getChannelData(c); for (let i = 0; i < n; i++) mono[i] += d[i] / ch; }
    let peak = 0; for (let i = 0; i < n; i++) peak = Math.max(peak, Math.abs(mono[i]));
    if (peak < 0.005) throw new Error('В записи тишина.');
    const g = 0.8 / peak; for (let i = 0; i < n; i++) mono[i] *= g;
    this._busy = true; this.emit('state', this.state());
    try {
      const r = await this.convertBuffer(mono, ab.sampleRate, voice);
      this.lastPhrase = { orig: mono, sr: ab.sampleRate, conv: r.data, convSr: r.sr };
      this.emit('phrase', { stage: 'ready', via: r.via });
      this._busy = false;
      await this.playFloat(r.data, r.sr);
    } finally { this._busy = false; this.emit('state', this.state()); }
  }

  /* ---------------- тестовая фраза ---------------- */
  setTestPhrase(tp) { this.testPhrase = tp; }

  async recordTest(ms) {
    if (this.recording) return null;
    await this._openMic();
    this._stopPlayback();
    this.recording = true; this._chunks = [];
    this._applyMode(); this.emit('recording', { ms });
    await sleep(ms);
    this.recording = false;
    const chunks = this._chunks; this._chunks = null;
    this._applyMode();
    if (!this.running) this._closeMic();
    const sr = this.ctx.sampleRate;
    const total = chunks.reduce((a, c) => a + c.length, 0), all = new Float32Array(total);
    let o = 0; for (const c of chunks) { all.set(c, o); o += c.length; }
    return this._finalizeTest(all, sr);
  }

  _finalizeTest(all, sr) {
    // обрезаем тишину по краям и выравниваем громкость
    const win = Math.round(sr * 0.02), thr = 0.015;
    let a = 0, b = all.length;
    while (a + win < all.length && rmsOf(all.subarray(a, a + win)) < thr) a += win;
    while (b - win > a && rmsOf(all.subarray(b - win, b)) < thr) b -= win;
    a = Math.max(0, a - Math.round(sr * 0.1)); b = Math.min(all.length, b + Math.round(sr * 0.15));
    if (b - a < sr * 0.4) return null;   // ничего не сказано
    const seg = all.slice(a, b);
    let peak = 0; for (let i = 0; i < seg.length; i++) peak = Math.max(peak, Math.abs(seg[i]));
    const g = peak > 0 ? 0.8 / peak : 1;
    for (let i = 0; i < seg.length; i++) seg[i] *= g;
    this.testPhrase = { sr, data: seg };
    return this.testPhrase;
  }

  async playTest(npc) {
    if (!this.testPhrase) return { needRecord: true };
    const r = await this.convertBuffer(this.testPhrase.data, this.testPhrase.sr, npc);
    await this.playFloat(r.data, r.sr);
    return { ok: true, via: r.via };
  }
  async playTestOriginal() {
    if (!this.testPhrase) return { needRecord: true };
    await this.playFloat(this.testPhrase.data, this.testPhrase.sr);
    return { ok: true };
  }

  /* ---------------- автокалибровка порога ---------------- */
  async calibrateGate(ms = 1600) {
    await this._openMic();
    const vals = [];
    this._calib = (v) => vals.push(v);
    await sleep(ms);
    this._calib = null;
    if (!this.running && !this.recording) this._closeMic();
    if (vals.length < 5) return null;
    vals.sort((x, y) => x - y);
    const p90 = vals[Math.floor(vals.length * 0.9)];
    const db = 20 * Math.log10(Math.max(p90, 1e-5)) + 10;
    return Math.round(Math.max(-65, Math.min(-25, db)));
  }
}




/* ====================================================================== */
/* Состояние                                                               */
/* ====================================================================== */
let library = loadLibrary();
const settings = loadSettings();
if (upgradeLibrary(library)) saveLibrary(library);
if (settings.migrated) { delete settings.migrated; saveSettings(settings); }
const engine = new AudioEngine();
engine.settings = settings;

const $ = (id) => document.getElementById(id);
const el = (tag, attrs, ...kids) => {
  const e = document.createElement(tag);
  for (const k in (attrs || {})) {
    if (k === 'class') e.className = attrs[k];
    else if (k === 'text') e.textContent = attrs[k];
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), attrs[k]);
    else if (attrs[k] !== false && attrs[k] != null) e.setAttribute(k, attrs[k] === true ? '' : attrs[k]);
  }
  for (const c of kids.flat()) if (c != null) e.append(c.nodeType ? c : document.createTextNode(c));
  return e;
};

const persist = () => saveLibrary(library);
const persistSettings = () => saveSettings(settings);
const byId = (id) => library.find((n) => n.id === id);
const selected = () => byId(settings.selectedId);
const colorOf = (n) => CATEGORY_COLORS[n.category] || '#d1a94f';
const fmt = (v, d = 1) => (Math.round(v * 10 ** d) / 10 ** d).toString().replace('.', ',');

/* ====================================================================== */
/* Уведомления                                                             */
/* ====================================================================== */
function toast(text, kind = '', ms = 4200) {
  const t = el('div', { class: 'toast ' + kind, text });
  $('toasts').append(t);
  setTimeout(() => t.remove(), ms);
}

/* ====================================================================== */
/* Список NPC: фильтр и сортировка                                         */
/* ====================================================================== */
function visibleList() {
  let list = library.slice();
  if (settings.filter === 'fav') list = list.filter((n) => n.favorite);
  else if (settings.filter !== 'all') list = list.filter((n) => n.category === settings.filter);
  const s = settings.sort;
  if (s === 'name') list.sort((a, b) => a.name.localeCompare(b.name, 'ru'));
  else if (s === 'category') list.sort((a, b) => CATEGORIES.indexOf(a.category) - CATEGORIES.indexOf(b.category) || a.name.localeCompare(b.name, 'ru'));
  else if (s === 'recent') list.sort((a, b) => (b.lastUsed || 0) - (a.lastUsed || 0));
  else list.sort((a, b) => a.order - b.order);
  return list;
}

function avatarNode(n, cls = 'avatar') {
  const a = el('div', { class: cls });
  if (n.avatar && n.avatar.type === 'image') a.append(el('img', { src: n.avatar.value, alt: '' }));
  else a.textContent = (n.avatar && n.avatar.value) || '🎭';
  return a;
}

/* ====================================================================== */
/* Отрисовка главного экрана                                               */
/* ====================================================================== */
function renderChips() {
  const box = $('chips'); box.replaceChildren();
  const add = (key, label) => box.append(el('button', {
    class: 'chip' + (settings.filter === key ? ' on' : ''), text: label,
    onclick: () => { settings.filter = key; persistSettings(); renderChips(); renderGrid(); }
  }));
  add('all', 'Все'); add('fav', '★ Избранное');
  const used = new Set(library.map((n) => n.category));
  CATEGORIES.filter((c) => used.has(c)).forEach((c) => add(c, c));
}

function renderGrid() {
  const grid = $('grid'); grid.replaceChildren();
  const list = visibleList();
  if (!list.length) {
    grid.append(el('div', { class: 'empty', text: settings.filter === 'fav' ? 'В избранном пока пусто. Нажмите ☆ на карточке NPC.' : 'Здесь пока нет NPC. Нажмите «＋», чтобы создать.' }));
  }
  for (const n of list) grid.append(cardNode(n));
  renderQuick();
}

function cardNode(n) {
  const isSel = n.id === settings.selectedId;
  const card = el('div', { class: 'card' + (isSel ? ' selected' : ''), 'data-id': n.id, role: 'button', tabindex: '0', style: `--cc:${colorOf(n)}` });
  card.append(
    el('span', { class: 'badge', text: 'Выбран' }),
    el('button', { class: 'fav' + (n.favorite ? ' on' : ''), 'aria-label': 'Избранное', text: n.favorite ? '★' : '☆',
      onclick: (e) => { e.stopPropagation(); n.favorite = !n.favorite; persist(); renderChips(); renderGrid(); } }),
    avatarNode(n),
    el('h3', { text: n.name }),
    el('p', { class: 'meta', text: n.voiceName ? 'Голос: ' + n.voiceName : 'Голос не назван' }),
    el('p', { class: 'kind', text: [n.kind, n.category].filter(Boolean).join(' · ') }),
    el('p', { class: 'desc', text: n.desc || '' }),
  );
  if (n.engine && n.engine !== 'dsp') card.append(el('span', { class: 'tag-engine', text: 'нейросеть' }));
  const play = el('button', { class: 'play', text: '▶ Пример', onclick: (e) => { e.stopPropagation(); preview(n, play); } });
  const edit = el('button', { text: '✎', 'aria-label': 'Настроить', onclick: (e) => { e.stopPropagation(); openEditor(n.id); } });
  card.append(el('div', { class: 'actions' }, play, edit));
  card.addEventListener('click', () => selectNpc(n.id));
  card.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); selectNpc(n.id); } });
  return card;
}

function renderQuick() {
  const q = $('quick'); q.replaceChildren();
  const fav = library.filter((n) => n.favorite).sort((a, b) => a.order - b.order);
  const list = fav.length ? fav : library.slice().sort((a, b) => a.order - b.order).slice(0, 8);
  for (const n of list) {
    const it = el('button', { class: 'q-item' + (n.id === settings.selectedId ? ' on' : ''), style: `--cc:${colorOf(n)}`, 'aria-label': n.name, onclick: () => selectNpc(n.id) },
      avatarNode(n, 'qa'), el('span', { text: n.name }));
    q.append(it);
  }
}

function updateSelectionUI() {
  document.querySelectorAll('.card').forEach((c) => c.classList.toggle('selected', c.dataset.id === settings.selectedId));
  renderQuick();
  const n = selected();
  $('nowVoice').textContent = n ? (n.avatar.type === 'emoji' ? n.avatar.value + ' ' : '') + n.name : 'NPC не выбран';
}

/* ====================================================================== */
/* Выбор NPC — мгновенно, без остановки микрофона                          */
/* ====================================================================== */
function selectNpc(id) {
  const n = byId(id); if (!n) return;
  settings.selectedId = id; n.lastUsed = Date.now();
  persistSettings(); persist();
  engine.setVoice(n);
  updateSelectionUI();
  refreshControls();
}

function stepNpc(dir) {
  const list = (library.some((n) => n.favorite) ? library.filter((n) => n.favorite) : library).slice().sort((a, b) => a.order - b.order);
  if (!list.length) return;
  const i = list.findIndex((n) => n.id === settings.selectedId);
  selectNpc(list[(i + dir + list.length) % list.length].id);
}

/* ====================================================================== */
/* Пример голоса и запись тестовой фразы                                   */
/* ====================================================================== */
let recBusy = false;
async function ensureTestPhrase() {
  if (engine.testPhrase) return true;
  return recordTestPhrase();
}

async function recordTestPhrase() {
  if (recBusy) return false;
  recBusy = true;
  const ov = $('recOverlay'); ov.hidden = false;
  const total = 4;
  let left = total; $('recCount').textContent = left;
  const iv = setInterval(() => { left = Math.max(0, left - 1); $('recCount').textContent = left; }, 1000);
  try {
    const tp = await engine.recordTest(total * 1000);
    if (!tp) { toast('Не удалось услышать голос. Говорите громче и ближе к микрофону.', 'err'); return false; }
    await saveTestPhrase({ sr: tp.sr, data: tp.data });
    toast('Тестовая фраза записана.', 'ok', 2200);
    return true;
  } catch (e) { reportMicError(e); return false; }
  finally { clearInterval(iv); ov.hidden = true; recBusy = false; refreshControls(); }
}

async function preview(npc, btn) {
  try {
    if (!(await ensureTestPhrase())) return;
    if (btn) { btn.classList.add('busy'); btn.textContent = '… звучит'; }
    const r = await engine.playTest(npc);
    if (r && r.via && r.via !== 'dsp') toast('Голос «' + npc.name + '» обработан нейросетью.', '', 1800);
  } catch (e) { toast('Не удалось проиграть пример: ' + (e.message || e), 'err'); }
  finally { if (btn) { btn.classList.remove('busy'); btn.textContent = '▶ Пример'; } }
}

async function playAllExamples() {
  if (!(await ensureTestPhrase())) return;
  closeSheet();
  for (const n of visibleList()) {
    toast('▶ ' + n.name, '', 1500);
    try { await engine.playTest(n); } catch { break; }
    await new Promise((r) => setTimeout(r, 250));
    if (engine._stopAll) break;
  }
}

/* ====================================================================== */
/* Микрофон                                                                 */
/* ====================================================================== */
let micFailed = false;
function reportMicError(e) {
  micFailed = true; refreshControls();
  const name = e && (e.name || e.code);
  let msg;
  if (name === 'NotAllowedError' || name === 'SecurityError') msg = 'Доступ к микрофону запрещён. Нажмите на значок замка рядом с адресом и разрешите микрофон, затем обновите страницу.';
  else if (name === 'NotFoundError' || name === 'OverconstrainedError') msg = 'Микрофон не найден. Проверьте подключение или выберите другой в настройках.';
  else if (name === 'NotReadableError') msg = 'Не удалось запустить микрофон: он занят другим приложением или недоступен этому приложению. Закройте звонки и записи и попробуйте снова.';
  else msg = (e && e.message) || 'Неизвестная ошибка микрофона.';
  if (name === 'Insecure' || !window.isSecureContext) msg = 'Браузер не даёт микрофон на этом адресе. Нажмите «Записать на телефон»: запишите фразу диктофоном, и приложение озвучит её голосом NPC.';
  if (e && (e.name || e.message)) msg += ' [' + [e.name, e.message].filter(Boolean).join(': ') + ']';

}

function slider({ label, hint, min, max, step, value, unit = '', digits = 1, onInput, dim }) {
  const out = el('b', { text: fmt(value, digits) + unit });
  const inp = el('input', { type: 'range', min, max, step, value, 'aria-label': label });
  const paint = () => inp.style.setProperty('--p', ((inp.value - min) / (max - min)) * 100 + '%');
  paint();
  inp.addEventListener('input', () => { const v = parseFloat(inp.value); out.textContent = fmt(v, digits) + unit; paint(); onInput(v); });
  inp.addEventListener('dblclick', () => { /* сброс по двойному тапу не нужен: есть кнопка */ });
  return el('div', { class: 'slider' + (dim ? ' dim' : '') }, el('div', { class: 'top' }, el('span', { text: label }), out), inp, hint ? el('small', { text: hint }) : null);
}

function pickAvatar(n, done) {
  const inp = $('fileAvatar'); inp.value = '';
  inp.onchange = async () => {
    const f = inp.files && inp.files[0]; if (!f) return;
    try {
      const bmp = await createImageBitmap(f);
      const s = 128, c = document.createElement('canvas'); c.width = c.height = s;
      const k = Math.max(s / bmp.width, s / bmp.height), w = bmp.width * k, h = bmp.height * k;
      c.getContext('2d').drawImage(bmp, (s - w) / 2, (s - h) / 2, w, h);
      n.avatar = { type: 'image', value: c.toDataURL('image/jpeg', 0.82) }; done();
    } catch { toast('Не удалось открыть эту картинку.', 'err'); }
  };
  inp.click();
}

function importFile() {
  const inp = $('fileImport'); inp.value = '';
  inp.onchange = async () => {
    const f = inp.files && inp.files[0]; if (!f) return;
    try {
      const { npcs } = parseBackup(await f.text());
      let added = 0, updated = 0;
      for (const n of npcs) {
        const ex = byId(n.id);
        if (ex) { Object.assign(ex, n); updated++; }
        else { n.order = Math.max(-1, ...library.map((x) => x.order)) + 1; library.push(n); added++; }
      }
      persist(); renderChips(); renderGrid(); updateSelectionUI();
      toast(`Готово: добавлено ${added}, обновлено ${updated}.`, 'ok');
      closeSheet(); openLibrary();
    } catch (e) { toast(e.message || 'Не удалось прочитать файл.', 'err'); }
  };
  inp.click();
}

function download(text, name, type) {
  if (window.AndroidBridge && typeof window.AndroidBridge.saveFile === 'function') {
    const bytes = new TextEncoder().encode(text);
    let binary = ''; for (let i = 0; i < bytes.length; i += 0x8000) binary += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    window.AndroidBridge.saveFile(name, type, btoa(binary));
    return;
  }
  const url = URL.createObjectURL(new Blob([text], { type }));
  const a = el('a', { href: url, download: name }); document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

  gateIn.addEventListener('input', () => { settings.gateDb = parseFloat(gateIn.value); paintGate(); persistSettings(); engine.applySettings(); });
  const calBtn = el('button', { class: 'btn small', text: 'Подобрать автоматически (помолчите 2 сек.)', onclick: async () => {
    calBtn.disabled = true; calBtn.textContent = 'Слушаю тишину…';
    try { const db = await engine.calibrateGate(); if (db == null) toast('Не получилось замерить шум.', 'err'); else { gateIn.value = db; settings.gateDb = db; paintGate(); persistSettings(); engine.applySettings(); toast('Порог установлен: ' + db + ' дБ', 'ok', 2500); } }
    catch (e) { reportMicError(e); } finally { calBtn.disabled = false; calBtn.textContent = 'Подобрать автоматически (помолчите 2 сек.)'; }
  } });

  const toggle = (label, key, hint, after) => {
    const b = el('button', { class: 'toggle', 'aria-pressed': String(!!settings[key]), onclick: () => { settings[key] = !settings[key]; b.setAttribute('aria-pressed', String(!!settings[key])); persistSettings(); engine.applySettings(); if (after) after(); refreshControls(); } }, el('span', { class: 'dot' }), label);
    return el('div', null, b, hint ? el('p', { class: 'hint', text: hint }) : null);
  };
  const latency = el('p', { class: 'hint' });
  const updateLatency = () => { const ms = engine.latencyMs(); latency.textContent = ms ? 'Текущая задержка живого режима: ≈' + ms + ' мс (включая устройство вывода).' : 'Задержка будет показана после включения микрофона.'; };
  updateLatency();

  const hang = slider({ label: 'Пауза, после которой фраза считается законченной', min: 300, max: 1800, step: 50, value: settings.phraseHangMs, digits: 0, unit: ' мс', onInput: (v) => { settings.phraseHangMs = v; persistSettings(); } });
  const master = slider({ label: 'Общая громкость', min: 0, max: 2, step: 0.05, value: settings.masterVolume, digits: 2, unit: '×', onInput: (v) => { settings.masterVolume = v; persistSettings(); engine.applySettings(); } });

  const srvBox = el('div', { class: 'status-line', text: 'Проверяю сервер на компьютере…' });
  const showServer = (s) => {
    if (!s) { srvBox.className = 'status-line'; srvBox.textContent = 'Сервер на компьютере не подключён. Встроенные голоса работают без него. Для нейросети откройте приложение по адресу, который показал компьютер.'; return; }
    srvBox.className = 'status-line ok';
    const names = Object.values(s.engines || {}).filter((e) => e.available).map((e) => e.title);
    srvBox.textContent = 'Компьютер подключён. Нейросетевые движки: ' + (names.length ? names.join(', ') : 'пока не установлены (см. инструкцию)');
  };
  showServer(engine.remote.status);
  engine.remote.probe().then(showServer);

  const testBtn = el('button', { class: 'btn', text: '🎙 Записать тестовую фразу', onclick: async () => { closeSheet(); await recordTestPhrase(); } });
  const hearOrig = el('button', { class: 'btn', text: '▶ Мой голос (оригинал)', onclick: async () => { if (!(await ensureTestPhrase())) return; await engine.playTestOriginal(); } });

  openSheet([
    el('h2', { text: 'Настройки' }),
    el('h4', { text: 'Микрофон' }),
    el('label', { class: 'f', text: 'Устройство ввода' }), inSel,
    el('label', { class: 'f', text: 'Порог тишины (шум ниже порога не обрабатывается)' }),
    el('div', { class: 'row' }, gateIn, gateOut), calBtn,
    toggle('Эхоподавление телефона', 'echoCancellation', 'По умолчанию ВЫКЛЮЧЕНО: добавляет задержку. Включайте, только если слышите своё эхо из динамика.', restartMic),
    toggle('Шумоподавление телефона', 'noiseSuppression', null, restartMic),
    el('h4', { text: 'Скорость и качество' }),
    el('label', { class: 'f', text: 'Окно обработки' }), qSel, latency,
    el('p', { class: 'hint', text: 'Чтобы задержка была минимальной: говорите в проводные наушники (USB-C), а не по Bluetooth — Bluetooth добавляет 100–200 мс. Режим «Минимальная задержка» уменьшает её ещё на ≈20 мс, но голос звучит чуть грубее.' }),
    toggle('Эффекты (хрипота, рычание, эхо)', 'fxEnabled', 'Выключите, если нужна минимальная задержка и чистый звук.'),
    hang, master,
    toggle('Если нейросеть недоступна — использовать встроенный голос', 'fallbackDsp'),
    el('h4', { text: 'Компьютер-сервер (нейросети)' }), srvBox,
    el('h4', { text: 'Пробная фраза' }),
    el('p', { class: 'hint', text: 'Запишите короткую фразу — по ней звучат «Пример» у карточек и кнопки прослушивания.' }),
    el('div', { class: 'grid-btns' }, testBtn, hearOrig),
    el('h4', { text: 'Данные' }),
    el('div', { class: 'grid-btns' },
      el('button', { class: 'btn', text: '⬇ Резервная копия', onclick: () => download(exportBackup(library, settings), 'голоса-npc.json', 'application/json') }),
      el('button', { class: 'btn', text: '⬆ Загрузить копию', onclick: importFile })),
    el('button', { class: 'btn danger block', style: 'margin-top:10px', text: 'Вернуть демо-NPC и сбросить всё', onclick: async () => { if (confirm('Все ваши NPC и настройки будут удалены. Продолжить?')) { try { localStorage.clear(); } catch { /* ok */ } location.reload(); } } }),
    el('div', { class: 'sticky' }, el('button', { class: 'btn primary', text: 'Готово', onclick: closeSheet })),
  ]);
}

async function restartMic() {
  const was = engine.running;
  if (!was) return;
  engine.stop();
  try { await engine.start(); } catch (e) { reportMicError(e); }
}

/* ====================================================================== */
/* Кнопки панели                                                           */
/* ====================================================================== */
$('btnMic').addEventListener('click', toggleMic);
$('btnPrev').addEventListener('click', () => stepNpc(-1));
$('btnNext').addEventListener('click', () => stepNpc(1));
$('btnAdd').addEventListener('click', addNpc);
$('btnLibrary').addEventListener('click', openLibrary);
$('btnSettings').addEventListener('click', openSettings);
$('btnPhoneRec').addEventListener('click', () => {
  if (!selected()) { toast('Сначала выберите NPC.', 'err'); return; }
  const inp = $('fileRec'); inp.value = '';
  inp.onchange = async () => {
    const f = inp.files && inp.files[0]; if (!f) return;
    try { toast('Обрабатываю запись…', '', 1800); await engine.processFile(await f.arrayBuffer(), selected()); }
    catch (e) { toast('Не удалось обработать запись: ' + (e && e.message ? e.message : 'формат не поддерживается'), 'err', 7000); }
  };
  inp.click();
});
$('btnUnmute').addEventListener('click', () => engine.unmute());
$('btnReplay').addEventListener('click', () => engine.playLast('conv'));
$('btnReplayOrig').addEventListener('click', () => engine.playLast('orig'));
$('btnAutoplay').addEventListener('click', () => { settings.autoplay = !settings.autoplay; persistSettings(); engine.applySettings(); refreshControls(); });
$('btnMonitor').addEventListener('click', () => { settings.monitor = settings.monitor === 'original' ? 'converted' : 'original'; persistSettings(); engine.applySettings(); refreshControls(); });
document.querySelectorAll('.seg button').forEach((b) => b.addEventListener('click', () => {
  settings.mode = b.dataset.mode; persistSettings(); engine.applySettings(); refreshControls();
  toast(settings.mode === 'live' ? 'Живой режим: голос звучит сразу, пока вы говорите.' : 'Режим фраз: ответ звучит после вашей паузы. Работает скорость речи и нейросеть.', '', 3200);
}));
document.addEventListener('keydown', (e) => {
  if (!$('overlay').hidden || /INPUT|TEXTAREA|SELECT/.test((e.target || {}).tagName || '')) return;
  if (e.code === 'Space') { e.preventDefault(); toggleMic(); }
  else if (e.key === 'ArrowRight') stepNpc(1);
  else if (e.key === 'ArrowLeft') stepNpc(-1);
  else if (/^[1-9]$/.test(e.key)) { const l = visibleList()[+e.key - 1]; if (l) selectNpc(l.id); }
});

/* ====================================================================== */
/* Запуск                                                                  */
/* ====================================================================== */
(async function init() {
  if (!hasSavedLibrary()) {
    const rec = await recoverFromMirror();
    if (rec) {
      if (rec.library) library = rec.library;
      if (rec.settings) Object.assign(settings, rec.settings);
      toast('Данные восстановлены из резервного хранилища.', 'ok', 3000);
    }
  }
  requestPersistent();
  if (!byId(settings.selectedId)) settings.selectedId = (library.slice().sort((a, b) => a.order - b.order)[0] || {}).id || null;
  renderChips(); renderGrid(); updateSelectionUI();
  const n = selected(); if (n) engine.setVoice(n);
  refreshControls();
  engine.remote.probe().then(() => { /* статус сервера нужен редактору */ });
  const tp = await loadTestPhrase();
  if (tp && tp.data) engine.setTestPhrase({ sr: tp.sr, data: tp.data });
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    Promise.reject().catch(() => { /* офлайн-режим не критичен */ });
  }
  document.addEventListener('visibilitychange', () => { if (document.hidden) { persist(); persistSettings(); } });
  window.addEventListener('pagehide', () => { persist(); persistSettings(); });
  window.__vdnd = { engine, get library() { return library; }, settings, selectNpc, toggleMic };
})();

})();
</script>
</body>
</html>
